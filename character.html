<!DOCTYPE html>
<html lang="zh-HK">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Bible Kids Adventure - Character Creator</title>
  <style>
    :root {
      --wood-dark: #3a2418;
      --wood: #7b4a2c;
      --wood-light: #a76a3c;
      --paper: #f6e2ad;
      --paper-dark: #d7b878;
      --ink: #3d2b1f;
      --green: #6b8f4e;
      --green-dark: #3f5f2d;
      --cream: #fff5d8;
    }

    * {
      box-sizing: border-box;
    }

    html,
    body {
      margin: 0;
      min-height: 100%;
      font-family: Arial, "Noto Sans TC", "Microsoft JhengHei", sans-serif;
      background: #6f8f5d;
      color: var(--ink);
    }

    body {
      min-height: 100vh;
      background:
        linear-gradient(rgba(48, 70, 39, .25), rgba(48, 70, 39, .25)),
        url("images/home-background.png") center / cover no-repeat fixed;
    }

    button,
    input {
      font: inherit;
    }

    button {
      cursor: pointer;
    }

    .page {
      min-height: 100vh;
      display: grid;
      place-items: center;
      padding: 18px;
    }

    .shell {
      width: min(1180px, 100%);
      min-height: 760px;
      display: grid;
      grid-template-rows: auto 1fr auto;
      border: 8px solid var(--wood-dark);
      background: linear-gradient(var(--wood-light), var(--wood));
      box-shadow: 0 12px 0 #27180f, 0 24px 55px rgba(0, 0, 0, .35);
      image-rendering: pixelated;
    }

    .header {
      padding: 18px 22px;
      border-bottom: 7px solid var(--wood-dark);
      text-align: center;
      color: var(--cream);
      text-shadow: 3px 3px 0 #4b2c19;
      background:
        repeating-linear-gradient(
          0deg,
          rgba(255,255,255,.04) 0 2px,
          transparent 2px 12px
        ),
        linear-gradient(#ad7040, #7b4828);
    }

    .header h1 {
      margin: 0;
      font-size: clamp(28px, 4vw, 46px);
    }

    .main {
      display: grid;
      grid-template-columns: minmax(330px, .9fr) minmax(470px, 1.2fr);
      min-height: 0;
    }

    .preview-panel {
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      padding: 28px;
      border-right: 7px solid var(--wood-dark);
      background:
        radial-gradient(circle at center, rgba(255,255,220,.5), transparent 60%),
        rgba(111, 148, 88, .75);
    }

    .preview-title {
      margin: 0 0 14px;
      padding: 8px 16px;
      border: 4px solid var(--wood-dark);
      background: var(--paper);
      box-shadow: 0 5px 0 #4b2b18;
      font-weight: 900;
    }

    .canvas-wrap {
      width: min(100%, 420px);
      aspect-ratio: 1 / 1;
      display: grid;
      place-items: center;
      border: 6px solid var(--wood-dark);
      background:
        linear-gradient(#d8ecad 0 70%, #7ea95f 70% 100%);
      box-shadow: inset 0 0 0 4px rgba(255,255,255,.25), 0 8px 0 #3b2417;
      overflow: hidden;
    }

    canvas {
      width: 88%;
      height: 88%;
      image-rendering: pixelated;
      image-rendering: crisp-edges;
    }

    .player-name {
      min-height: 44px;
      margin-top: 18px;
      padding: 8px 18px;
      border: 4px solid var(--wood-dark);
      background: var(--paper);
      box-shadow: 0 5px 0 #4b2b18;
      font-size: 23px;
      font-weight: 900;
      text-align: center;
    }

    .options-panel {
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 30px;
      background: linear-gradient(135deg, rgba(95,57,31,.95), rgba(73,42,23,.98));
    }

    .paper {
      width: min(100%, 700px);
      min-height: 500px;
      display: flex;
      flex-direction: column;
      padding: 34px;
      border: 5px solid #6b4828;
      background:
        repeating-linear-gradient(
          3deg,
          rgba(110,75,38,.05) 0 1px,
          transparent 1px 10px
        ),
        linear-gradient(145deg, #fff0c8, var(--paper));
      box-shadow: 0 8px 0 #422615;
    }

    .question {
      margin: 0;
      text-align: center;
      color: #9a3f1d;
      font-size: clamp(28px, 4vw, 42px);
      font-weight: 900;
    }

    .help {
      margin: 10px auto 24px;
      max-width: 560px;
      text-align: center;
      font-weight: 700;
      line-height: 1.5;
      color: #684e35;
    }

    .choices {
      flex: 1;
      display: grid;
      grid-template-columns: repeat(3, minmax(0, 1fr));
      gap: 14px;
      align-content: center;
    }

    .choice {
      min-height: 90px;
      padding: 12px;
      border: 4px solid #5f3b21;
      background: #fff7da;
      box-shadow: 0 5px 0 #4a2b18;
      color: var(--ink);
      font-weight: 900;
      transition: transform .12s ease;
    }

    .choice:hover {
      transform: translateY(-3px);
    }

    .choice.selected {
      outline: 5px solid #7ba650;
      background: #eef6c9;
    }

    .swatch {
      width: 46px;
      height: 46px;
      margin: 0 auto 8px;
      border: 4px solid #4c2d1b;
      box-shadow: 0 3px 0 #3a2115;
    }

    .mini-canvas {
      display: block;
      width: 72px;
      height: 72px;
      margin: 0 auto 8px;
      image-rendering: pixelated;
    }

    .name-box {
      width: min(100%, 480px);
      margin: auto;
    }

    .name-box label {
      display: block;
      margin-bottom: 12px;
      text-align: center;
      font-size: 19px;
      font-weight: 900;
    }

    .name-box input {
      width: 100%;
      padding: 15px 18px;
      border: 4px solid #5f3b21;
      background: #fffdf0;
      box-shadow: 0 5px 0 #4a2b18;
      font-size: 22px;
      font-weight: 900;
      text-align: center;
      outline: none;
    }

    .footer {
      display: grid;
      grid-template-columns: 1fr auto 1fr;
      align-items: center;
      gap: 14px;
      padding: 14px 20px;
      border-top: 7px solid var(--wood-dark);
      background: linear-gradient(#9b5e35, #6b3d23);
    }

    .nav-btn {
      min-height: 52px;
      padding: 10px 18px;
      border: 4px solid #3e2517;
      background: linear-gradient(#f0c96d, #b87834);
      box-shadow: 0 5px 0 #2f1c12;
      color: #fff5dd;
      font-weight: 900;
      text-shadow: 2px 2px 0 #5a341e;
    }

    .nav-btn:disabled {
      opacity: .45;
      cursor: not-allowed;
    }

    .back {
      justify-self: start;
    }

    .next {
      justify-self: end;
    }

    .progress {
      color: #fff0c8;
      font-weight: 900;
      text-align: center;
      text-shadow: 2px 2px 0 #4d2b19;
    }

    @media (max-width: 820px) {
      .page {
        padding: 8px;
      }

      .shell {
        min-height: 0;
        border-width: 5px;
      }

      .main {
        grid-template-columns: 1fr;
      }

      .preview-panel {
        border-right: 0;
        border-bottom: 5px solid var(--wood-dark);
        padding: 18px;
      }

      .canvas-wrap {
        width: min(82vw, 330px);
      }

      .options-panel {
        padding: 16px 10px 20px;
      }

      .paper {
        min-height: 430px;
        padding: 24px 16px;
      }

      .choices {
        grid-template-columns: repeat(2, minmax(0, 1fr));
      }

      .footer {
        padding: 12px 8px;
      }

      .nav-btn {
        padding: 9px 11px;
        font-size: 14px;
      }
    }

    @media (max-width: 430px) {
      .choices {
        grid-template-columns: 1fr 1fr;
        gap: 10px;
      }

      .choice {
        min-height: 82px;
        padding: 8px;
        font-size: 14px;
      }

      .mini-canvas {
        width: 60px;
        height: 60px;
      }

      .footer {
        grid-template-columns: 1fr 90px 1fr;
      }
    }
  
    /* Version 2: smaller iPad layout and a more imaginative adventure background */
    .page::before {
      content: "";
      position: absolute;
      inset: 0;
      pointer-events: none;
      background:
        radial-gradient(circle at 12% 16%, rgba(255,247,177,.34) 0 4px, transparent 5px),
        radial-gradient(circle at 86% 22%, rgba(255,247,177,.27) 0 3px, transparent 4px),
        radial-gradient(circle at 20% 78%, rgba(255,247,177,.24) 0 3px, transparent 4px),
        radial-gradient(circle at 76% 72%, rgba(255,247,177,.22) 0 4px, transparent 5px);
      background-size: 145px 135px, 175px 155px, 160px 170px, 190px 150px;
      opacity: .9;
    }

    .page::after {
      content: "";
      position: absolute;
      left: 0;
      right: 0;
      bottom: 0;
      height: 22%;
      pointer-events: none;
      background:
        linear-gradient(transparent, rgba(39,67,32,.22)),
        repeating-linear-gradient(90deg, rgba(55,98,43,.28) 0 7px, transparent 7px 18px);
      clip-path: polygon(
        0 62%, 7% 40%, 14% 62%, 22% 35%, 31% 58%,
        40% 32%, 50% 61%, 60% 37%, 70% 59%, 80% 33%,
        90% 58%, 100% 39%, 100% 100%, 0 100%
      );
    }

    .shell {
      width: min(1080px, 94vw);
      min-height: 680px;
      max-height: 90svh;
    }

    .canvas-wrap {
      width: min(100%, 350px);
    }

    @media (min-width: 768px) and (max-width: 1180px) {
      .page {
        padding: 12px;
      }

      .shell {
        width: min(960px, 91vw);
        min-height: 600px;
        height: min(700px, 87svh);
        border-width: 6px;
      }

      .header {
        min-height: 66px;
        padding: 10px 18px;
      }

      .main {
        grid-template-columns: minmax(270px,.82fr) minmax(400px,1.18fr);
      }

      .preview-panel {
        padding: 16px 20px;
      }

      .canvas-wrap {
        width: min(100%, 290px);
      }

      .options-panel {
        padding: 17px;
      }

      .paper {
        min-height: 400px;
        padding: 22px;
      }

      .choice {
        min-height: 77px;
        padding: 8px;
      }

      .mini-canvas {
        width: 58px;
        height: 58px;
      }

      .footer {
        min-height: 62px;
        padding: 9px 14px;
      }
    }

  </style>
</head>
<body>
  <main class="page">
    <section class="shell">
      <header class="header">
        <h1 id="pageTitle">Create Your Pixel Character!</h1>
      </header>

      <section class="main">
        <div class="preview-panel">
          <p class="preview-title" id="previewTitle">Your Character</p>

          <div class="canvas-wrap">
            <canvas id="characterCanvas" width="160" height="160"></canvas>
          </div>

          <div class="player-name" id="playerNameDisplay">Young Explorer</div>
        </div>

        <div class="options-panel">
          <section class="paper">
            <h2 class="question" id="questionTitle">Boy or Girl?</h2>
            <p class="help" id="questionHelp">Choose your character.</p>
            <div class="choices" id="choices"></div>
          </section>
        </div>
      </section>

      <footer class="footer">
        <button class="nav-btn back" id="backBtn" type="button">← Back</button>
        <div class="progress" id="progressText">Step 1 / 7</div>
        <button class="nav-btn next" id="nextBtn" type="button" disabled>Next →</button>
      </footer>
    </section>
  </main>

  <script>
    const canvas = document.getElementById("characterCanvas");
    const ctx = canvas.getContext("2d");
    ctx.imageSmoothingEnabled = false;

    const choices = document.getElementById("choices");
    const questionTitle = document.getElementById("questionTitle");
    const questionHelp = document.getElementById("questionHelp");
    const progressText = document.getElementById("progressText");
    const backBtn = document.getElementById("backBtn");
    const nextBtn = document.getElementById("nextBtn");
    const playerNameDisplay = document.getElementById("playerNameDisplay");

    const TOTAL_STEPS = 7;
    let currentStep = 0;

    const state = {
      gender: "",
      skin: "#d99a6c",
      hairStyle: "short",
      hair: "#5a3525",
      outfit: "shirt",
      clothes: "#3f78b5",
      name: ""
    };

    const language = localStorage.getItem("bibleKidsLanguage") === "zh-HK" ? "zh-HK" : "en";

    const copy = {
      en: {
        title: "Create Your Pixel Character!",
        preview: "Your Character",
        defaultName: "Young Explorer",
        back: "← Back",
        next: "Next →",
        finish: "Begin Adventure →",
        steps: [
          ["Boy or Girl?", "Choose your character."],
          ["Choose Skin Tone", "Choose the skin tone you like."],
          ["Choose Hairstyle", "Choose a clean pixel hairstyle."],
          ["Choose Hair Colour", "Choose your character's hair colour."],
          ["Choose Clothes", "Choose an outfit for the adventure."],
          ["Choose Clothes Colour", "Choose the main colour of the clothes."],
          ["What Is Your Name?", "Enter the name used in your adventure."]
        ],
        labels: {
          boy: "Boy",
          girl: "Girl",
          light: "Light",
          warm: "Warm",
          tan: "Tan",
          brown: "Brown",
          deep: "Deep",
          short: "Short",
          spiky: "Spiky",
          side: "Side",
          bob: "Bob",
          long: "Long",
          pony: "Ponytail",
          dark: "Dark",
          chestnut: "Chestnut",
          golden: "Golden",
          auburn: "Auburn",
          red: "Red",
          black: "Black",
          shirt: "Shirt",
          hoodie: "Hoodie",
          overalls: "Overalls",
          tunic: "Tunic",
          dress: "Dress",
          smart: "Smart",
          blue: "Blue",
          green: "Green",
          redClothes: "Red",
          yellow: "Yellow",
          pink: "Pink",
          grey: "Grey",
          enterName: "Enter your name",
          placeholder: "Type your name"
        }
      },
      "zh-HK": {
        title: "建立你嘅像素角色！",
        preview: "你嘅角色",
        defaultName: "小小探險家",
        back: "← 上一步",
        next: "下一步 →",
        finish: "開始冒險 →",
        steps: [
          ["你係男仔定女仔？", "揀選你想建立嘅角色。"],
          ["揀選膚色", "揀一個你鍾意嘅膚色。"],
          ["揀選髮型", "揀一個整齊嘅像素髮型。"],
          ["揀選頭髮顏色", "揀選角色嘅頭髮顏色。"],
          ["揀選衣服", "揀一套適合冒險嘅衣服。"],
          ["揀選衣服顏色", "揀選衣服嘅主要顏色。"],
          ["你叫咩名？", "輸入冒險旅程中使用嘅名字。"]
        ],
        labels: {
          boy: "男仔",
          girl: "女仔",
          light: "淺色",
          warm: "暖色",
          tan: "小麥色",
          brown: "啡色",
          deep: "深色",
          short: "短髮",
          spiky: "尖髮",
          side: "側分",
          bob: "齊肩",
          long: "長髮",
          pony: "馬尾",
          dark: "深啡",
          chestnut: "栗啡",
          golden: "金色",
          auburn: "紅啡",
          red: "紅色",
          black: "黑色",
          shirt: "上衣",
          hoodie: "連帽衫",
          overalls: "工人褲",
          tunic: "探險衣",
          dress: "裙",
          smart: "恤衫",
          blue: "藍色",
          green: "綠色",
          redClothes: "紅色",
          yellow: "黃色",
          pink: "粉紅",
          grey: "灰色",
          enterName: "輸入你嘅名字",
          placeholder: "喺度輸入名字"
        }
      }
    };

    const t = copy[language];
    document.documentElement.lang = language;
    document.getElementById("pageTitle").textContent = t.title;
    document.getElementById("previewTitle").textContent = t.preview;

    const options = {
      gender: [
        { value: "boy", label: "boy" },
        { value: "girl", label: "girl" }
      ],
      skin: [
        { value: "#f2c29b", label: "light" },
        { value: "#dda06f", label: "warm" },
        { value: "#bf7448", label: "tan" },
        { value: "#8c4f35", label: "brown" },
        { value: "#56372b", label: "deep" }
      ],
      hairStyle: [
        { value: "short", label: "short" },
        { value: "spiky", label: "spiky" },
        { value: "side", label: "side" },
        { value: "bob", label: "bob" },
        { value: "long", label: "long" },
        { value: "pony", label: "pony" }
      ],
      hair: [
        { value: "#2c201c", label: "black" },
        { value: "#5a3525", label: "dark" },
        { value: "#8a4f2c", label: "chestnut" },
        { value: "#d0a84d", label: "golden" },
        { value: "#9e4b32", label: "auburn" },
        { value: "#bb3d28", label: "red" }
      ],
      outfit: [
        { value: "shirt", label: "shirt" },
        { value: "hoodie", label: "hoodie" },
        { value: "overalls", label: "overalls" },
        { value: "tunic", label: "tunic" },
        { value: "dress", label: "dress" },
        { value: "smart", label: "smart" }
      ],
      clothes: [
        { value: "#3f78b5", label: "blue" },
        { value: "#4f8a52", label: "green" },
        { value: "#b84b43", label: "redClothes" },
        { value: "#d8b448", label: "yellow" },
        { value: "#c76d96", label: "pink" },
        { value: "#737b84", label: "grey" }
      ]
    };

    function pixelRect(context, x, y, w, h, color) {
      context.fillStyle = color;
      context.fillRect(x, y, w, h);
    }


    function shadeColour(hex, amount) {
      const clean = hex.replace("#", "");
      let red = parseInt(clean.slice(0, 2), 16);
      let green = parseInt(clean.slice(2, 4), 16);
      let blue = parseInt(clean.slice(4, 6), 16);

      red = Math.max(0, Math.min(255, red + amount));
      green = Math.max(0, Math.min(255, green + amount));
      blue = Math.max(0, Math.min(255, blue + amount));

      return "#" + [red, green, blue]
        .map(value => value.toString(16).padStart(2, "0"))
        .join("");
    }

    function drawCharacter(context, s, size = 160) {
      context.clearRect(0, 0, size, size);
      context.imageSmoothingEnabled = false;

      const scale = size / 160;
      context.save();
      context.scale(scale, scale);

      const outline = "#2b211c";
      const skin = s.skin;
      const skinDark = shadeColour(s.skin, -20);
      const skinLight = shadeColour(s.skin, 20);
      const hair = s.hair;
      const hairDark = shadeColour(s.hair, -24);
      const hairLight = shadeColour(s.hair, 22);
      const clothes = s.clothes;
      const clothesDark = shadeColour(s.clothes, -26);
      const clothesLight = shadeColour(s.clothes, 22);

      // shadow
      pixelRect(context, 49, 140, 62, 8, "rgba(40,45,30,.28)");

      // legs
      pixelRect(context, 60, 112, 16, 28, outline);
      pixelRect(context, 84, 112, 16, 28, outline);
      pixelRect(context, 64, 116, 10, 22, "#394c68");
      pixelRect(context, 86, 116, 10, 22, "#394c68");

      // shoes
      pixelRect(context, 56, 136, 24, 8, outline);
      pixelRect(context, 82, 136, 24, 8, outline);
      pixelRect(context, 60, 136, 18, 5, "#6b4228");
      pixelRect(context, 84, 136, 18, 5, "#6b4228");

      // hair behind
      if (["bob", "long", "pony"].includes(s.hairStyle)) {
        pixelRect(context, 46, 38, 68, 58, outline);
        pixelRect(context, 50, 42, 60, 54, hair);
      }

      if (s.hairStyle === "long") {
        pixelRect(context, 46, 82, 14, 38, outline);
        pixelRect(context, 100, 82, 14, 38, outline);
        pixelRect(context, 50, 82, 10, 34, hair);
        pixelRect(context, 100, 82, 10, 34, hair);
      }

      if (s.hairStyle === "pony") {
        pixelRect(context, 108, 48, 18, 42, outline);
        pixelRect(context, 112, 52, 10, 34, hair);
      }

      // body outline
      pixelRect(context, 48, 88, 64, 42, outline);

      if (s.outfit === "dress") {
        pixelRect(context, 52, 92, 56, 34, clothes);
        pixelRect(context, 44, 120, 72, 14, outline);
        pixelRect(context, 48, 120, 64, 10, clothes);
      } else {
        pixelRect(context, 52, 92, 56, 34, clothes);
      }

      // arms
      pixelRect(context, 38, 92, 14, 34, outline);
      pixelRect(context, 108, 92, 14, 34, outline);
      pixelRect(context, 42, 96, 10, 28, skin);
      pixelRect(context, 108, 96, 10, 28, skin);

      // outfit details
      if (s.outfit === "hoodie") {
        pixelRect(context, 60, 92, 40, 8, "#f0e5c3");
        pixelRect(context, 74, 100, 4, 17, "#f0e5c3");
        pixelRect(context, 84, 100, 4, 17, "#f0e5c3");
        pixelRect(context, 66, 116, 28, 7, outline);
      }

      if (s.outfit === "overalls") {
        pixelRect(context, 56, 92, 48, 10, "#f0e5c3");
        pixelRect(context, 60, 96, 8, 26, clothes);
        pixelRect(context, 92, 96, 8, 26, clothes);
        pixelRect(context, 66, 104, 28, 22, "#4d6f9d");
      }

      if (s.outfit === "tunic") {
        pixelRect(context, 78, 92, 4, 34, "#e5d2a2");
        pixelRect(context, 52, 112, 56, 6, "#7b4c27");
      }

      if (s.outfit === "smart") {
        pixelRect(context, 68, 92, 24, 28, "#f5edd8");
        pixelRect(context, 77, 96, 6, 22, "#9f3c37");
      }

      // neck
      pixelRect(context, 68, 80, 24, 14, outline);
      pixelRect(context, 72, 80, 16, 14, skin);

      // ears
      pixelRect(context, 42, 50, 12, 26, outline);
      pixelRect(context, 106, 50, 12, 26, outline);
      pixelRect(context, 46, 54, 8, 18, skin);
      pixelRect(context, 106, 54, 8, 18, skin);

      // head
      pixelRect(context, 50, 34, 60, 52, outline);
      pixelRect(context, 54, 38, 52, 44, skin);

      // front hair
      if (s.hairStyle === "short") {
        pixelRect(context, 50, 30, 60, 18, outline);
        pixelRect(context, 54, 34, 52, 14, hair);
        pixelRect(context, 58, 44, 12, 8, hair);
      }

      if (s.hairStyle === "spiky") {
        pixelRect(context, 50, 34, 60, 16, outline);
        pixelRect(context, 54, 38, 52, 12, hair);
        pixelRect(context, 54, 26, 10, 12, hair);
        pixelRect(context, 68, 22, 10, 16, hair);
        pixelRect(context, 82, 24, 10, 14, hair);
        pixelRect(context, 96, 28, 10, 10, hair);
      }

      if (s.hairStyle === "side") {
        pixelRect(context, 50, 30, 60, 18, outline);
        pixelRect(context, 54, 34, 52, 14, hair);
        pixelRect(context, 54, 44, 28, 8, hair);
      }

      if (s.hairStyle === "bob") {
        pixelRect(context, 50, 30, 60, 20, outline);
        pixelRect(context, 54, 34, 52, 16, hair);
        pixelRect(context, 50, 44, 12, 38, hair);
        pixelRect(context, 98, 44, 12, 38, hair);
      }

      if (s.hairStyle === "long") {
        pixelRect(context, 50, 30, 60, 20, outline);
        pixelRect(context, 54, 34, 52, 16, hair);
      }

      if (s.hairStyle === "pony") {
        pixelRect(context, 50, 30, 60, 20, outline);
        pixelRect(context, 54, 34, 52, 16, hair);
      }

      // eyes
      pixelRect(context, 66, 58, 8, 10, outline);
      pixelRect(context, 88, 58, 8, 10, outline);
      pixelRect(context, 68, 58, 3, 3, "#ffffff");
      pixelRect(context, 90, 58, 3, 3, "#ffffff");

      // cheeks
      pixelRect(context, 58, 70, 8, 4, "#d87d74");
      pixelRect(context, 96, 70, 8, 4, "#d87d74");

      // mouth
      pixelRect(context, 74, 74, 14, 4, outline);
      pixelRect(context, 78, 78, 6, 3, "#ffffff");


      // extra pixel shading and details
      pixelRect(context, 64, 116, 10, 5, "#4b6280");
      pixelRect(context, 86, 116, 10, 5, "#4b6280");

      pixelRect(context, 60, 136, 18, 2, "#8a5c3a");
      pixelRect(context, 84, 136, 18, 2, "#8a5c3a");

      pixelRect(context, 52, 92, 56, 5, clothesLight);
      pixelRect(context, 52, 122, 56, 4, clothesDark);

      pixelRect(context, 42, 96, 4, 24, skinDark);
      pixelRect(context, 108, 96, 4, 24, skinDark);
      pixelRect(context, 46, 96, 4, 18, skinLight);
      pixelRect(context, 112, 96, 4, 18, skinLight);

      pixelRect(context, 54, 38, 52, 5, skinLight);
      pixelRect(context, 54, 77, 52, 5, skinDark);

      pixelRect(context, 66, 55, 8, 3, hairDark);
      pixelRect(context, 88, 55, 8, 3, hairDark);

      pixelRect(context, 70, 61, 2, 3, "#76503a");
      pixelRect(context, 92, 61, 2, 3, "#76503a");

      pixelRect(context, 78, 67, 4, 5, skinDark);
      pixelRect(context, 82, 70, 3, 2, skinLight);

      if (s.hairStyle !== "spiky") {
        pixelRect(context, 58, 34, 35, 4, hairLight);
        pixelRect(context, 98, 38, 8, 8, hairDark);
      }

      if (s.gender === "girl") {
        pixelRect(context, 104, 42, 8, 8, outline);
        pixelRect(context, 106, 44, 4, 4, "#e1b84d");
      }

      context.restore();
    }

    function createMiniCanvas(customState) {
      const mini = document.createElement("canvas");
      mini.width = 80;
      mini.height = 80;
      mini.className = "mini-canvas";
      const miniCtx = mini.getContext("2d");
      miniCtx.imageSmoothingEnabled = false;
      drawCharacter(miniCtx, customState, 80);
      return mini;
    }

    function updatePreview() {
      drawCharacter(ctx, state, 160);
      playerNameDisplay.textContent = state.name.trim() || t.defaultName;
    }

    function saveState() {
      localStorage.setItem("bibleKidsCharacter", JSON.stringify(state));
      localStorage.setItem("bibleKidsPlayerName", state.name.trim());
    }

    function selectValue(key, value) {
      state[key] = value;

      // Gender can always be switched in either direction.
      // Keep the selected hairstyle instead of locking or overwriting the choice.
      saveState();
      updatePreview();
      renderStep();
    }

    function renderImageChoices(key, list) {
      choices.className = "choices";

      list.forEach(item => {
        const btn = document.createElement("button");
        btn.type = "button";
        btn.className = "choice" + (state[key] === item.value ? " selected" : "");

        const previewState = { ...state, [key]: item.value };

        if (key === "gender") {
          previewState.hairStyle = item.value === "girl" ? "bob" : "short";
        }

        btn.appendChild(createMiniCanvas(previewState));

        const label = document.createElement("div");
        label.textContent = t.labels[item.label];
        btn.appendChild(label);

        btn.addEventListener("click", () => selectValue(key, item.value));
        choices.appendChild(btn);
      });
    }

    function renderColourChoices(key, list) {
      choices.className = "choices";

      list.forEach(item => {
        const btn = document.createElement("button");
        btn.type = "button";
        btn.className = "choice" + (state[key] === item.value ? " selected" : "");

        const swatch = document.createElement("div");
        swatch.className = "swatch";
        swatch.style.background = item.value;

        const label = document.createElement("div");
        label.textContent = t.labels[item.label];

        btn.append(swatch, label);
        btn.addEventListener("click", () => selectValue(key, item.value));
        choices.appendChild(btn);
      });
    }

    function renderNameStep() {
      choices.className = "";
      const box = document.createElement("div");
      box.className = "name-box";

      const label = document.createElement("label");
      label.textContent = t.labels.enterName;
      label.htmlFor = "nameInput";

      const input = document.createElement("input");
      input.id = "nameInput";
      input.maxLength = 18;
      input.placeholder = t.labels.placeholder;
      input.value = state.name;

      input.addEventListener("input", () => {
        state.name = input.value.replace(/[<>]/g, "").slice(0, 18);
        input.value = state.name;
        saveState();
        updatePreview();
        updateButtons();
      });

      box.append(label, input);
      choices.appendChild(box);
      setTimeout(() => input.focus(), 50);
    }

    function renderStep() {
      const [title, help] = t.steps[currentStep];
      questionTitle.textContent = title;
      questionHelp.textContent = help;
      choices.innerHTML = "";

      if (currentStep === 0) renderImageChoices("gender", options.gender);
      if (currentStep === 1) renderColourChoices("skin", options.skin);
      if (currentStep === 2) renderImageChoices("hairStyle", options.hairStyle);
      if (currentStep === 3) renderColourChoices("hair", options.hair);
      if (currentStep === 4) renderImageChoices("outfit", options.outfit);
      if (currentStep === 5) renderColourChoices("clothes", options.clothes);
      if (currentStep === 6) renderNameStep();

      progressText.textContent = language === "zh-HK"
        ? `第 ${currentStep + 1}／${TOTAL_STEPS} 步`
        : `Step ${currentStep + 1} / ${TOTAL_STEPS}`;

      updateButtons();
    }

    function stepComplete() {
      if (currentStep === 0) return state.gender !== "";
      if (currentStep === 6) return state.name.trim().length > 0;
      return true;
    }

    function updateButtons() {
      backBtn.textContent = t.back;
      nextBtn.textContent = currentStep === TOTAL_STEPS - 1 ? t.finish : t.next;
      nextBtn.disabled = !stepComplete();
    }

    backBtn.addEventListener("click", () => {
      if (currentStep === 0) {
        window.location.href = "index.html";
        return;
      }

      currentStep--;
      renderStep();
    });

    nextBtn.addEventListener("click", () => {
      if (!stepComplete()) return;

      if (currentStep < TOTAL_STEPS - 1) {
        currentStep++;
        renderStep();
      } else {
        saveState();
        window.location.href = "map.html";
      }
    });

    function loadSavedState() {
      try {
        const saved = JSON.parse(localStorage.getItem("bibleKidsCharacter"));
        if (saved && typeof saved === "object") {
          const compatible = {
            gender: saved.gender === "boy" || saved.gender === "girl" ? saved.gender : "",
            skin: typeof saved.skin === "string" ? saved.skin : state.skin,
            hairStyle: typeof saved.hairStyle === "string" ? saved.hairStyle : state.hairStyle,
            hair: typeof saved.hair === "string" ? saved.hair : state.hair,
            outfit: typeof saved.outfit === "string" ? saved.outfit : state.outfit,
            clothes: typeof saved.clothes === "string" ? saved.clothes : state.clothes,
            name: typeof saved.name === "string" ? saved.name : ""
          };

          Object.assign(state, compatible);
        }
      } catch (error) {
        console.warn("Could not load saved character.", error);
      }
    }

    loadSavedState();
    updatePreview();
    renderStep();
  </script>
</body>
</html>
