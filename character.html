<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Choose Your Character | Bible Kids Adventure</title>
  <style>
    :root{--wood-dark:#4f2c18;--wood-medium:#80502b;--cream:#fff4cf;--paper:#f7e4b6;--green:#4f8f46;--green-dark:#2e612f;--gold:#f3c956;--text-dark:#342111}
    *{box-sizing:border-box}html,body{min-height:100%;margin:0}body{font-family:"Trebuchet MS",Arial,sans-serif;color:var(--text-dark);background:linear-gradient(rgba(31,74,43,.2),rgba(31,74,43,.28)),url("assets/backgrounds/character-background.png") center/cover no-repeat fixed}button,input{font:inherit}.screen{min-height:100vh;display:flex;justify-content:center;align-items:center;padding:30px 18px}.panel{width:min(1100px,100%);padding:30px;border:7px solid var(--wood-dark);border-radius:24px;background:linear-gradient(rgba(255,244,207,.95),rgba(247,228,182,.95));box-shadow:0 11px 0 #321c0f,0 22px 35px rgba(0,0,0,.35)}.header{margin-bottom:28px;text-align:center}.game-name{margin:0 0 5px;color:var(--green-dark);font-size:.9rem;font-weight:900;letter-spacing:2px;text-transform:uppercase}h1{margin:0;color:var(--wood-dark);font-size:clamp(2rem,5vw,3.4rem);line-height:1.05;text-shadow:0 3px 0 rgba(255,255,255,.8)}.instruction{margin:12px 0 0;font-size:1.05rem;font-weight:700}.character-grid{display:grid;grid-template-columns:repeat(4,1fr);gap:18px}.character-card{position:relative;min-width:0;padding:13px 11px 16px;cursor:pointer;border:5px solid var(--wood-medium);border-radius:18px;color:var(--text-dark);background:linear-gradient(180deg,#fff9e3 0%,#efd29b 100%);box-shadow:0 7px 0 var(--wood-dark),0 12px 17px rgba(64,38,17,.25);transition:transform 150ms ease,border-color 150ms ease,box-shadow 150ms ease}.character-card:hover{transform:translateY(-5px);border-color:var(--gold);box-shadow:0 11px 0 var(--wood-dark),0 17px 21px rgba(64,38,17,.3)}.character-card.selected{transform:translateY(-7px) scale(1.025);border-color:var(--gold);background:linear-gradient(180deg,#fffdeb 0%,#f5d36d 100%);box-shadow:0 10px 0 var(--green-dark),0 17px 23px rgba(64,38,17,.34)}.character-card.selected::after{content:"SELECTED";position:absolute;top:-16px;left:50%;transform:translateX(-50%);padding:5px 12px;border:3px solid var(--green-dark);border-radius:999px;color:#fff;background:var(--green);font-size:.7rem;font-weight:900;letter-spacing:1px}.portrait{width:100%;aspect-ratio:1/1;display:flex;justify-content:center;align-items:flex-end;overflow:hidden;border:4px solid var(--wood-dark);border-radius:14px;background:radial-gradient(circle at 50% 35%,#fff7cf 0%,#badf94 58%,#75a95f 100%)}.portrait img{width:100%;height:100%;object-fit:contain;object-position:center bottom;image-rendering:pixelated}.character-card h2{margin:11px 0 2px;color:var(--wood-dark);font-size:1.4rem}.character-card p{min-height:38px;margin:0;font-size:.88rem;font-weight:700}.feature{display:inline-block;margin-top:8px;padding:5px 9px;border:2px solid rgba(79,44,24,.25);border-radius:999px;background:rgba(255,255,255,.55);font-size:.75rem;font-weight:900}.player-section{max-width:470px;margin:30px auto 0;text-align:center}.player-section label{display:block;margin-bottom:8px;color:var(--wood-dark);font-size:1.15rem;font-weight:900}#playerName{width:100%;padding:13px 16px;border:4px solid var(--wood-medium);border-radius:13px;outline:none;color:var(--text-dark);background:#fffdf4;font-size:1.08rem;font-weight:800;text-align:center}#playerName:focus{border-color:var(--green);box-shadow:0 0 0 4px rgba(79,143,70,.2)}.message{min-height:25px;margin:8px 0;color:#a02520;font-size:.9rem;font-weight:900}.start-button{width:min(100%,330px);padding:14px 22px;cursor:pointer;border:4px solid var(--green-dark);border-radius:14px;color:#fff;background:linear-gradient(180deg,#6caf5b 0%,#3e7e39 100%);font-size:1.15rem;font-weight:900;box-shadow:0 7px 0 #224c25,0 12px 17px rgba(28,65,31,.28);transition:transform 120ms ease,box-shadow 120ms ease}.start-button:hover{transform:translateY(-2px);box-shadow:0 9px 0 #224c25,0 15px 18px rgba(28,65,31,.3)}.start-button:active{transform:translateY(5px);box-shadow:0 2px 0 #224c25,0 5px 8px rgba(28,65,31,.24)}@media(max-width:850px){.character-grid{grid-template-columns:repeat(2,1fr)}.panel{padding:27px 20px}}@media(max-width:480px){.screen{padding:17px 9px}.panel{padding:24px 12px;border-width:5px;border-radius:18px}.character-grid{gap:12px}.character-card{padding:9px 7px 12px;border-width:4px}.character-card h2{font-size:1.08rem}.character-card p{min-height:32px;font-size:.72rem}.feature{padding:4px 6px;font-size:.66rem}}
  </style>
</head>
<body>
  <main class="screen">
    <section class="panel">
      <header class="header">
        <p class="game-name">Bible Kids Adventure</p>
        <h1>Choose Your Character</h1>
        <p class="instruction">Choose an adventurer and enter your name.</p>
      </header>
      <div class="character-grid">
        <button class="character-card" type="button" data-character="samuel"><div class="portrait"><img src="assets/characters/samuel-card.png" alt="Samuel"></div><h2>Samuel</h2><p>Brave Explorer</p><span class="feature">Blue scarf</span></button>
        <button class="character-card" type="button" data-character="caleb"><div class="portrait"><img src="assets/characters/caleb-card.png" alt="Caleb"></div><h2>Caleb</h2><p>Faithful Adventurer</p><span class="feature">Green cape</span></button>
        <button class="character-card" type="button" data-character="hannah"><div class="portrait"><img src="assets/characters/hannah-card.png" alt="Hannah"></div><h2>Hannah</h2><p>Kind Helper</p><span class="feature">Pink ribbons</span></button>
        <button class="character-card" type="button" data-character="esther"><div class="portrait"><img src="assets/characters/esther-card.png" alt="Esther"></div><h2>Esther</h2><p>Confident Leader</p><span class="feature">Blue bow</span></button>
      </div>
      <section class="player-section">
        <label for="playerName">What is your name?</label>
        <input id="playerName" type="text" maxlength="15" autocomplete="off" placeholder="Enter your name">
        <p class="message" id="message" aria-live="polite"></p>
        <button class="start-button" id="startButton" type="button">Start Adventure</button>
      </section>
    </section>
  </main>
  <script>
    "use strict";
    const characterCards=document.querySelectorAll(".character-card");
    const playerNameInput=document.getElementById("playerName");
    const startButton=document.getElementById("startButton");
    const message=document.getElementById("message");
    let selectedCharacter="";
    characterCards.forEach(card=>{card.addEventListener("click",()=>{characterCards.forEach(otherCard=>otherCard.classList.remove("selected"));card.classList.add("selected");selectedCharacter=card.dataset.character;message.textContent="";});});
    function startAdventure(){const playerName=playerNameInput.value.trim();if(!selectedCharacter){message.textContent="Please choose a character first.";return;}if(!playerName){message.textContent="Please enter your name.";playerNameInput.focus();return;}const playerData={playerName,selectedCharacter};localStorage.setItem("bibleKidsPlayer",JSON.stringify(playerData));localStorage.setItem("playerName",playerName);localStorage.setItem("selectedCharacter",selectedCharacter);window.location.href="map.html";}
    startButton.addEventListener("click",startAdventure);
    playerNameInput.addEventListener("keydown",event=>{if(event.key==="Enter")startAdventure();});
  </script>
</body>
</html>
