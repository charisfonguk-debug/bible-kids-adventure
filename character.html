<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Bible Kids Adventure</title>
<style>
:root{--ink:#2f241b;--paper:#fff6d9;--wood:#8a4f27;--wood-dark:#4a2815;--wood-light:#bd7541;--gold:#f4c75d}
*{box-sizing:border-box}html,body{min-height:100%}body{margin:0;font-family:Arial,sans-serif;color:var(--ink);background:#315a36}button,input{font:inherit}
.screen{display:none;min-height:100vh;padding:24px}.screen.active{display:grid;place-items:center}
.panel{width:min(1050px,100%);padding:28px;border:8px solid var(--wood-dark);border-radius:26px;background:repeating-linear-gradient(90deg,var(--paper) 0,var(--paper) 34px,#faedc5 34px,#faedc5 68px);box-shadow:inset 0 0 0 5px var(--wood-light),0 20px 50px #0005}
.center{text-align:center}.eyebrow{font-weight:900;letter-spacing:.12em;text-transform:uppercase;color:#315a36}.hero h1,.panel h1{font-size:clamp(2.4rem,7vw,5rem);margin:.2em 0}.wood{border:4px solid var(--wood-dark);border-radius:12px;padding:13px 22px;color:#fff;font-weight:900;cursor:pointer;background:repeating-linear-gradient(0deg,var(--wood-light) 0,var(--wood-light) 9px,var(--wood) 9px,var(--wood) 18px);box-shadow:0 6px 0 #3a1f11}.wood:active{transform:translateY(4px);box-shadow:0 2px 0 #3a1f11}
.character-grid{display:grid;grid-template-columns:repeat(4,1fr);gap:18px;margin:30px 0}.card{position:relative;border:5px solid var(--wood-dark);border-radius:22px;padding:18px 12px;background:radial-gradient(circle at 50% 24%,#fffdf3 0 32%,transparent 33%),linear-gradient(#fff9e4,#efdfad);box-shadow:0 8px 0 #61351c,0 16px 25px #51321f22;cursor:pointer;transition:.18s transform,.18s filter}.card:hover{transform:translateY(-4px);filter:brightness(1.03)}.card.selected{outline:6px solid var(--gold);transform:translateY(-8px)}.card.selected:before{content:'★';position:absolute;right:10px;top:8px;color:#e7ad24;font-size:1.5rem;text-shadow:0 2px white}.card canvas{width:170px;max-width:100%;image-rendering:pixelated;filter:drop-shadow(0 8px 4px #51321f35)}.name{display:block;font-size:1.2rem;font-weight:900}.role{display:block;font-size:.85rem;opacity:.75}
.form{display:flex;gap:12px;justify-content:center;align-items:center;flex-wrap:wrap}.form input{padding:12px 14px;border:4px solid var(--wood-dark);border-radius:10px;background:#fff8df}.error{min-height:20px;color:#a22;font-weight:700}
.map-shell{width:min(980px,100%)}.map-head{display:flex;justify-content:space-between;align-items:center;gap:12px;margin-bottom:12px;padding:14px 18px;border:5px solid var(--wood-dark);border-radius:16px;background:var(--paper)}.map-head h2{margin:0}.game-wrap{border:8px solid var(--wood-dark);border-radius:16px;overflow:hidden;box-shadow:0 18px 35px #0006;background:#78b65b}.game-wrap canvas{display:block;width:100%;height:auto;image-rendering:pixelated}.controls{text-align:center;margin-top:14px}.controls button{width:58px;height:52px;margin:3px;border:4px solid var(--wood-dark);border-radius:10px;background:var(--wood);color:white;font-weight:900;box-shadow:0 5px 0 #3a1f11;touch-action:none}
@media(max-width:800px){.character-grid{grid-template-columns:repeat(2,1fr)}}
</style>
</head>
<body>
<section id="home" class="screen active">
  <div class="panel hero center">
    <p class="eyebrow">A Bible RPG Adventure</p>
    <h1>Bible Kids Adventure</h1>
    <p>Explore the world, meet Bible characters, and discover God’s story.</p>
    <button class="wood" id="startBtn">Start Adventure</button>
  </div>
</section>

<section id="select" class="screen">
  <div class="panel center">
    <p class="eyebrow">Choose Your Hero</p>
    <h1 style="font-size:clamp(2rem,5vw,3.4rem)">Choose Your Character</h1>
    <div class="character-grid">
      <button class="card selected" data-id="samuel"><canvas width="256" height="288"></canvas><span class="name">Samuel</span><span class="role">Brave Explorer</span></button>
      <button class="card" data-id="caleb"><canvas width="256" height="288"></canvas><span class="name">Caleb</span><span class="role">Faithful Adventurer</span></button>
      <button class="card" data-id="hannah"><canvas width="256" height="288"></canvas><span class="name">Hannah</span><span class="role">Kind Girl Adventurer</span></button>
      <button class="card" data-id="esther"><canvas width="256" height="288"></canvas><span class="name">Esther</span><span class="role">Courageous Girl Leader</span></button>
    </div>
    <form class="form" id="nameForm">
      <input id="playerName" maxlength="14" placeholder="Enter your name" required>
      <button class="wood" type="submit">Start Adventure</button>
    </form>
    <p class="error" id="error"></p>
  </div>
</section>

<section id="map" class="screen">
  <div class="map-shell">
    <div class="map-head"><div><small class="eyebrow">Genesis Village</small><h2 id="welcome">Welcome</h2></div><button class="wood" id="changeBtn">Change Character</button></div>
    <div class="game-wrap"><canvas id="game" width="768" height="512"></canvas></div>
    <div class="controls">
      <button data-dir="up">▲</button><br>
      <button data-dir="left">◀</button><button data-dir="down">▼</button><button data-dir="right">▶</button>
    </div>
  </div>
</section>

<script>
const STYLES={
 samuel:{skin:'#e2a071',skinShadow:'#bd734f',hair:'#6a402d',hairLight:'#8b5a3e',shirt:'#497dad',dark:'#294f79',accent:'#d9c5a1',trousers:'#76503a',shoes:'#3d2b23',item:'scarf'},
 caleb:{skin:'#b8754e',skinShadow:'#8f5137',hair:'#29252a',hairLight:'#48424c',shirt:'#5c874d',dark:'#365b34',accent:'#b5a56e',trousers:'#8c6842',shoes:'#342821',item:'cape'},
 hannah:{skin:'#f0bb91',skinShadow:'#ca866a',hair:'#865339',hairLight:'#a96f4e',shirt:'#d97998',dark:'#9b4f6d',accent:'#f7d6df',trousers:'#a75f7c',shoes:'#593a32',item:'braids',girl:true},
 esther:{skin:'#bd7e59',skinShadow:'#94573f',hair:'#382a2b',hairLight:'#5b4241',shirt:'#6e89ba',dark:'#425b88',accent:'#b9d1f2',trousers:'#526a94',shoes:'#3b2c27',item:'longhair',girl:true}
};
function px(c,x,y,w,h,color,s=1){c.fillStyle=color;c.fillRect(x*s,y*s,w*s,h*s)}
function rr(c,x,y,w,h,r,color,stroke=null,line=1){
 c.beginPath();c.roundRect(x,y,w,h,r);c.fillStyle=color;c.fill();
 if(stroke){c.strokeStyle=stroke;c.lineWidth=line;c.stroke()}
}
function eye(c,x,y,lookX=0){
 c.fillStyle='#30251f';c.beginPath();c.ellipse(x,y,7,9,0,0,Math.PI*2);c.fill();
 c.fillStyle='#fff';c.beginPath();c.ellipse(x-2+lookX,y-3,2.7,3.2,0,0,Math.PI*2);c.fill();
 c.fillStyle='#86b8d4';c.beginPath();c.ellipse(x+2,y+4,2.5,2,0,0,Math.PI*2);c.fill();
}
function drawChar(c,st,dir='down',frame=0,ox=0,oy=0,s=1){
 c.save();c.translate(ox,oy);c.scale(s,s);c.imageSmoothingEnabled=false;
 const walk=frame===1?-2:frame===2?2:0;
 const bob=frame===0?0:1;

 // Soft RPG shadow
 c.fillStyle='rgba(54,35,25,.22)';
 c.beginPath();c.ellipse(32,63,22,6,0,0,Math.PI*2);c.fill();

 // Legs and boots
 rr(c,18+walk,49+bob,10,13,4,st.trousers);
 rr(c,36-walk,49+bob,10,13,4,st.trousers);
 rr(c,15+walk,58+bob,15,7,4,st.shoes);
 rr(c,34-walk,58+bob,15,7,4,st.shoes);

 // Body
 rr(c,13,34+bob,38,22,10,st.shirt,st.dark,2);
 px(c,14,48+bob,36,6,st.dark);
 px(c,30,35+bob,4,18,st.accent);
 if(st.girl){
   c.fillStyle=st.shirt;c.beginPath();c.moveTo(15,47+bob);c.lineTo(49,47+bob);c.lineTo(55,59+bob);c.lineTo(9,59+bob);c.closePath();c.fill();
   px(c,12,53+bob,40,3,st.accent);
 }

 // Arms
 rr(c,7,36+bob-walk,11,20,6,st.skin,st.skinShadow,1.5);
 rr(c,46,36+bob+walk,11,20,6,st.skin,st.skinShadow,1.5);
 rr(c,9,35+bob-walk,10,11,5,st.shirt);
 rr(c,45,35+bob+walk,10,11,5,st.shirt);

 // Neck
 rr(c,26,29+bob,12,9,4,st.skin);

 // Oversized chibi head
 rr(c,10,5+bob,44,33,15,st.skin,st.skinShadow,1.5);

 // Hair silhouette by direction
 if(dir==='up'){
   rr(c,9,4+bob,46,30,15,st.hair);
   px(c,13,27+bob,38,9,st.hair);
   px(c,19,32+bob,26,5,st.hairLight);
 }else{
   rr(c,8,2+bob,48,17,14,st.hair);
   rr(c,7,9+bob,11,19,7,st.hair);
   rr(c,46,9+bob,11,19,7,st.hair);
   px(c,13,7+bob,9,7,st.hairLight);
   px(c,23,4+bob,9,8,st.hairLight);
   px(c,34,7+bob,8,7,st.hairLight);
 }

 if(dir!=='up'){
   if(dir==='left'){
     eye(c,23,23+bob,-1);
     c.strokeStyle='#7c403e';c.lineWidth=2;c.beginPath();c.arc(23,31+bob,4,.25,2.65);c.stroke();
   }else if(dir==='right'){
     eye(c,41,23+bob,1);
     c.strokeStyle='#7c403e';c.lineWidth=2;c.beginPath();c.arc(41,31+bob,4,.49,2.9);c.stroke();
   }else{
     eye(c,23,23+bob,-.5);eye(c,41,23+bob,.5);
     // Slightly sad, gentle mouth
     c.strokeStyle='#8b4d4b';c.lineWidth=2;c.beginPath();c.arc(32,33+bob,5,3.55,5.88);c.stroke();
     // Blush
     c.fillStyle='rgba(217,103,105,.34)';
     c.beginPath();c.ellipse(16,30+bob,4,2,0,0,Math.PI*2);c.fill();
     c.beginPath();c.ellipse(48,30+bob,4,2,0,0,Math.PI*2);c.fill();
   }
 }

 // Character-specific accessories
 if(st.item==='scarf'){
   rr(c,13,32+bob,38,8,4,st.dark);
   px(c,15,38+bob,8,15,st.dark);
 }
 if(st.item==='cape'){
   c.fillStyle=st.dark;c.beginPath();c.moveTo(9,36+bob);c.lineTo(4,59+bob);c.lineTo(18,54+bob);c.closePath();c.fill();
   c.beginPath();c.moveTo(55,36+bob);c.lineTo(60,59+bob);c.lineTo(46,54+bob);c.closePath();c.fill();
 }
 if(st.item==='braids' && dir!=='up'){
   rr(c,7,24+bob,8,25,4,st.hair);
   rr(c,49,24+bob,8,25,4,st.hair);
   rr(c,8,43+bob,7,7,3,st.accent);
   rr(c,49,43+bob,7,7,3,st.accent);
 }
 if(st.item==='longhair'){
   if(dir==='up'){
     rr(c,8,8+bob,48,38,16,st.hair);
     px(c,13,36+bob,38,15,st.hair);
     px(c,20,43+bob,24,8,st.hairLight);
   }else{
     rr(c,6,16+bob,11,35,6,st.hair);
     rr(c,47,16+bob,11,35,6,st.hair);
     rr(c,10,10+bob,44,18,12,st.hair);
     px(c,12,13+bob,10,6,st.hairLight);
     c.fillStyle=st.accent;
     c.beginPath();c.moveTo(44,8+bob);c.lineTo(58,3+bob);c.lineTo(54,16+bob);c.closePath();c.fill();
     c.beginPath();c.moveTo(44,8+bob);c.lineTo(54,20+bob);c.lineTo(39,15+bob);c.closePath();c.fill();
     rr(c,44,7+bob,7,7,3,st.dark);
   }
 }
 if(st.item==='bow' && dir!=='up'){
   c.fillStyle=st.accent;
   c.beginPath();c.moveTo(45,7+bob);c.lineTo(57,3+bob);c.lineTo(54,14+bob);c.closePath();c.fill();
   c.beginPath();c.moveTo(45,7+bob);c.lineTo(53,18+bob);c.lineTo(40,14+bob);c.closePath();c.fill();
   rr(c,44,6+bob,6,6,3,st.dark);
 }

 c.restore();
}
document.querySelectorAll('.card').forEach(card=>{const cv=card.querySelector('canvas');const pc=cv.getContext('2d');pc.clearRect(0,0,cv.width,cv.height);drawChar(pc,STYLES[card.dataset.id],'down',0,0,0,4);card.onclick=()=>{document.querySelectorAll('.card').forEach(x=>x.classList.remove('selected'));card.classList.add('selected');selected=card.dataset.id}});
let selected=localStorage.getItem('selectedCharacter')||'samuel';document.querySelectorAll('.card').forEach(c=>c.classList.toggle('selected',c.dataset.id===selected));
const screens=[...document.querySelectorAll('.screen')];function show(id){screens.forEach(s=>s.classList.toggle('active',s.id===id))}
startBtn.onclick=()=>show('select');changeBtn.onclick=()=>show('select');
nameForm.onsubmit=e=>{e.preventDefault();const n=playerName.value.trim();if(n.length<2){error.textContent='Please enter at least 2 letters.';return}localStorage.setItem('playerName',n);localStorage.setItem('selectedCharacter',selected);welcome.textContent='Welcome, '+n;error.textContent='';show('map')};

const cv=document.getElementById('game'),ctx=cv.getContext('2d'),T=32,keys=new Set();ctx.imageSmoothingEnabled=false;const p={x:352,y:320,speed:2.6,dir:'down',frame:0,clock:0};
const obs=[{x:64,y:64,w:192,h:128},{x:480,y:64,w:192,h:128},{x:96,y:352,w:160,h:96},{x:544,y:352,w:128,h:96},{x:0,y:0,w:768,h:32},{x:0,y:480,w:768,h:32},{x:0,y:0,w:32,h:512},{x:736,y:0,w:32,h:512}];
function overlap(a,b){return a.x<b.x+b.w&&a.x+a.w>b.x&&a.y<b.y+b.h&&a.y+a.h>b.y}function can(x,y){const h={x:x+8,y:y+22,w:18,h:15};return !obs.some(o=>overlap(h,o))}
function house(x,y,roof){ctx.fillStyle='#5b371f';ctx.fillRect(x,y+42,192,86);ctx.fillStyle='#f1d89e';ctx.fillRect(x+8,y+48,176,72);ctx.fillStyle=roof;ctx.beginPath();ctx.moveTo(x-8,y+52);ctx.lineTo(x+96,y);ctx.lineTo(x+200,y+52);ctx.fill();ctx.fillStyle='#54321f';ctx.fillRect(x+78,y+78,36,42)}
function tree(x,y){ctx.fillStyle='#70452a';ctx.fillRect(x+13,y+22,10,24);ctx.fillStyle='#3b7f46';ctx.fillRect(x,y+12,36,16);ctx.fillRect(x+8,y,20,34)}
function drawMap(){for(let r=0;r<16;r++)for(let c=0;c<24;c++){ctx.fillStyle=(c>=10&&c<=13||r>=7&&r<=9)?((r+c)%2?'#d8bb78':'#c8a865'):((r+c)%2?'#79b95d':'#72af56');ctx.fillRect(c*T,r*T,T,T)}house(64,64,'#c96b4b');house(480,64,'#5878b8');house(96,352,'#9c65a7');house(544,352,'#d38a43');for(let x=0;x<768;x+=48){tree(x,0);tree(x,466)}for(let y=38;y<470;y+=54){tree(0,y);tree(730,y)}ctx.fillStyle='#3b708b';ctx.fillRect(264,390,202,74);ctx.fillStyle='#67b4da';ctx.fillRect(272,398,186,58)}
function update(dt){let dx=0,dy=0;if(keys.has('arrowup')||keys.has('w')){dy-=p.speed;p.dir='up'}if(keys.has('arrowdown')||keys.has('s')){dy+=p.speed;p.dir='down'}if(keys.has('arrowleft')||keys.has('a')){dx-=p.speed;p.dir='left'}if(keys.has('arrowright')||keys.has('d')){dx+=p.speed;p.dir='right'}if(dx&&dy){dx*=.707;dy*=.707}if(can(p.x+dx,p.y))p.x+=dx;if(can(p.x,p.y+dy))p.y+=dy;if(dx||dy){p.clock+=dt;if(p.clock>150){p.clock=0;p.frame=(p.frame+1)%3}}else p.frame=0}
function draw(){ctx.clearRect(0,0,768,512);drawMap();drawChar(ctx,STYLES[localStorage.getItem('selectedCharacter')||selected],p.dir,p.frame,Math.round(p.x-16),Math.round(p.y-28),1)}let last=performance.now();function loop(now){update(Math.min(40,now-last));last=now;draw();requestAnimationFrame(loop)}requestAnimationFrame(loop);
addEventListener('keydown',e=>{const k=e.key.toLowerCase();if(['arrowup','arrowdown','arrowleft','arrowright','w','a','s','d'].includes(k)){e.preventDefault();keys.add(k)}});addEventListener('keyup',e=>keys.delete(e.key.toLowerCase()));
document.querySelectorAll('[data-dir]').forEach(b=>{const k='arrow'+b.dataset.dir;b.onpointerdown=e=>{e.preventDefault();keys.add(k)};b.onpointerup=b.onpointerleave=b.onpointercancel=e=>{e.preventDefault();keys.delete(k)}});
</script>
</body>
</html>
