<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Bible Kids Adventure - Character Creator</title>
<style>
:root{
  --ink:#2b221b;
  --cream:#fff2c9;
  --paper:#f3d997;
  --wood:#8a532f;
  --wood-dark:#3d281c;
  --green:#5f9648;
  --green-light:#8fc66a;
  --gold:#e8bd55;
}
*{box-sizing:border-box}
body{
  margin:0;
  min-height:100vh;
  font-family:Arial,"Microsoft JhengHei",sans-serif;
  color:var(--ink);
  background:#7fbc68;
}
button,input{font:inherit}
button{cursor:pointer}

.world{
  min-height:100vh;
  padding:18px;
  display:grid;
  place-items:center;
  position:relative;
  overflow:hidden;
  background:
    linear-gradient(#9fd3f2 0 52%,#7ec461 52% 100%);
}
.world:before{
  content:"";
  position:absolute;
  inset:auto 0 18% 0;
  height:18%;
  background:
    linear-gradient(135deg,transparent 0 18%,#6cab52 18% 50%,transparent 50%),
    linear-gradient(35deg,transparent 0 22%,#5a9447 22% 54%,transparent 54%);
  opacity:.9;
}
.world:after{
  content:"";
  position:absolute;
  left:0;right:0;bottom:0;height:22%;
  background:
    repeating-linear-gradient(90deg,transparent 0 24px,rgba(46,105,43,.24) 24px 27px,transparent 27px 48px),
    linear-gradient(#6aae4f,#4f8c40);
}
.cloud{
  position:absolute;
  width:100px;height:28px;
  background:white;
  border-radius:30px;
  opacity:.85;
}
.cloud:before,.cloud:after{
  content:"";
  position:absolute;
  background:white;
  border-radius:50%;
}
.cloud:before{width:38px;height:38px;left:18px;bottom:4px}
.cloud:after{width:48px;height:48px;right:12px;bottom:2px}
.c1{top:9%;left:8%}
.c2{top:19%;right:9%;transform:scale(.75)}

.tree{
  position:absolute;
  bottom:13%;
  width:78px;height:118px;
}
.tree:before{
  content:"";
  position:absolute;
  width:18px;height:52px;
  left:30px;bottom:0;
  background:#6c472b;
  border:4px solid #3f2c20;
}
.tree:after{
  content:"";
  position:absolute;
  width:78px;height:72px;
  left:0;top:0;
  border-radius:45%;
  background:#4d8a3e;
  border:5px solid #315f2d;
  box-shadow:17px 20px 0 -3px #5b9b47,-15px 21px 0 -5px #5b9b47;
}
.t1{left:3%}
.t2{right:3%;transform:scale(.86)}

.game{
  position:relative;
  z-index:2;
  width:min(1080px,96vw);
  min-height:680px;
  display:grid;
  grid-template-rows:auto 1fr auto;
  border:7px solid var(--wood-dark);
  border-radius:18px;
  overflow:hidden;
  background:var(--wood);
  box-shadow:0 10px 0 #271910,0 25px 55px rgba(0,0,0,.32);
}
.header{
  padding:15px;
  text-align:center;
  color:var(--cream);
  border-bottom:6px solid var(--wood-dark);
  background:
    repeating-linear-gradient(0deg,rgba(255,255,255,.05) 0 2px,transparent 2px 12px),
    linear-gradient(#a86a3c,#744326);
  text-shadow:3px 3px 0 #4c2c1a;
}
.header h1{margin:0;font-size:clamp(25px,3.7vw,42px)}

.main{
  display:grid;
  grid-template-columns:.9fr 1.1fr;
  min-height:0;
}
.preview{
  display:flex;
  flex-direction:column;
  align-items:center;
  justify-content:center;
  padding:24px;
  border-right:6px solid var(--wood-dark);
  background:
    linear-gradient(rgba(255,255,255,.08),rgba(0,0,0,.03)),
    repeating-linear-gradient(90deg,#79ad5a 0 22px,#82b965 22px 44px);
}
.preview-title{
  margin:0 0 14px;
  padding:8px 15px;
  background:var(--paper);
  border:4px solid var(--wood-dark);
  border-radius:8px;
  box-shadow:0 5px 0 #4d301e;
  font-weight:900;
}
.scene{
  width:min(100%,340px);
  aspect-ratio:1;
  display:grid;
  place-items:center;
  position:relative;
  overflow:hidden;
  border:6px solid var(--wood-dark);
  border-radius:12px;
  background:
    linear-gradient(#c7eafa 0 58%,#8fc86d 58% 100%);
  box-shadow:0 8px 0 #3a2518,inset 0 0 0 4px rgba(255,255,255,.22);
}
.scene:before{
  content:"";
  position:absolute;
  left:0;right:0;bottom:18%;
  height:13%;
  background:repeating-linear-gradient(90deg,#518f43 0 4px,transparent 4px 11px);
  clip-path:polygon(0 72%,6% 30%,12% 70%,20% 28%,28% 68%,36% 36%,43% 74%,52% 28%,60% 70%,69% 30%,78% 68%,87% 25%,94% 64%,100% 35%,100% 100%,0 100%);
}
.scene:after{
  content:"";
  position:absolute;
  left:50%;bottom:14%;
  width:100px;height:18px;
  transform:translateX(-50%);
  background:rgba(47,69,39,.25);
  border-radius:50%;
}
canvas{
  width:256px;
  height:256px;
  image-rendering:pixelated;
  image-rendering:crisp-edges;
  z-index:2;
}
.nameplate{
  margin-top:16px;
  min-width:180px;
  padding:9px 16px;
  text-align:center;
  font-size:20px;
  font-weight:900;
  background:var(--paper);
  border:4px solid var(--wood-dark);
  border-radius:8px;
  box-shadow:0 5px 0 #4d301e;
}
.options{
  padding:22px;
  background:linear-gradient(135deg,#654029,#43291c);
}
.paper{
  height:100%;
  min-height:500px;
  padding:25px;
  border:5px solid #68442a;
  border-radius:12px;
  background:
    repeating-linear-gradient(3deg,rgba(100,70,35,.045) 0 1px,transparent 1px 10px),
    linear-gradient(#fff0c0,#efd28d);
  box-shadow:0 7px 0 #342116;
}
.question{
  margin:0;
  text-align:center;
  color:#a1482c;
  font-size:clamp(27px,3.3vw,40px);
}
.help{
  margin:8px 0 20px;
  text-align:center;
  font-weight:700;
  color:#6d5136;
}
.choices{
  display:grid;
  grid-template-columns:repeat(3,minmax(0,1fr));
  gap:13px;
}
.choice{
  min-height:96px;
  padding:11px 8px;
  border:4px solid #543520;
  border-radius:10px;
  background:linear-gradient(#fff9df,#f3deb0);
  box-shadow:0 5px 0 #3e281a;
  color:var(--ink);
  font-weight:900;
  transition:transform .12s ease,filter .12s ease;
}
.choice:hover{transform:translateY(-3px);filter:brightness(1.03)}
.choice:active{transform:translateY(2px);box-shadow:0 2px 0 #3e281a}
.choice.selected{
  outline:5px solid #6da24e;
  outline-offset:2px;
  background:#edf7c9;
}
.swatch{
  width:48px;height:48px;
  margin:0 auto 8px;
  border:4px solid #4d301f;
  border-radius:8px;
  box-shadow:inset 0 0 0 3px rgba(255,255,255,.18);
}
.icon{
  width:56px;height:56px;
  margin:0 auto 8px;
  display:grid;
  place-items:center;
  font-size:30px;
}
.namebox{
  width:min(100%,440px);
  margin:90px auto 0;
  text-align:center;
  font-weight:900;
}
.namebox input{
  width:100%;
  margin-top:12px;
  padding:15px;
  border:4px solid #543520;
  border-radius:10px;
  background:#fffdf0;
  font-size:21px;
  font-weight:900;
  text-align:center;
  outline:none;
}
.namebox input:focus{outline:5px solid #75a956;outline-offset:2px}

.footer{
  display:grid;
  grid-template-columns:1fr auto 1fr;
  gap:12px;
  align-items:center;
  padding:12px 16px;
  border-top:6px solid var(--wood-dark);
  background:linear-gradient(#9d6037,#6d4025);
}
.nav{
  min-height:52px;
  padding:10px 18px;
  border:4px solid #3f281a;
  border-radius:9px;
  background:linear-gradient(#efca6c,#b77732);
  box-shadow:0 5px 0 #2d1c12;
  color:white;
  font-weight:900;
  text-shadow:2px 2px 0 #58331e;
}
.nav:active{transform:translateY(2px);box-shadow:0 2px 0 #2d1c12}
.nav:disabled{opacity:.45;cursor:not-allowed}
.back{justify-self:start}.next{justify-self:end}
.progress{color:#fff0cb;font-weight:900;text-align:center;text-shadow:2px 2px 0 #4b2b19}

@media(max-width:790px){
  .world{padding:8px}
  .game{width:100%;min-height:0}
  .main{grid-template-columns:1fr}
  .preview{border-right:0;border-bottom:6px solid var(--wood-dark);padding:18px}
  .scene{width:250px}
  canvas{width:208px;height:208px}
  .paper{min-height:430px;padding:20px 14px}
  .choices{grid-template-columns:repeat(2,minmax(0,1fr))}
  .options{padding:14px}
  .footer{padding:10px 7px}
  .nav{padding:9px 10px;font-size:14px}
}
</style>
</head>
<body>
<main class="world">
  <div class="cloud c1"></div>
  <div class="cloud c2"></div>
  <div class="tree t1"></div>
  <div class="tree t2"></div>

  <section class="game">
    <header class="header">
      <h1>Create Your Adventure Character!</h1>
    </header>

    <section class="main">
      <div class="preview">
        <p class="preview-title">Your Character</p>
        <div class="scene">
          <canvas id="character" width="64" height="64"></canvas>
        </div>
        <div class="nameplate" id="nameDisplay">Young Explorer</div>
      </div>

      <div class="options">
        <section class="paper">
          <h2 class="question" id="question">Boy or Girl?</h2>
          <p class="help" id="help">Choose your character.</p>
          <div class="choices" id="choices"></div>
        </section>
      </div>
    </section>

    <footer class="footer">
      <button class="nav back" id="backBtn">← Home</button>
      <div class="progress" id="progress">Step 1 / 7</div>
      <button class="nav next" id="nextBtn" disabled>Next →</button>
    </footer>
  </section>
</main>

<script>
const canvas=document.getElementById("character");
const ctx=canvas.getContext("2d");
ctx.imageSmoothingEnabled=false;

const choices=document.getElementById("choices");
const question=document.getElementById("question");
const help=document.getElementById("help");
const progress=document.getElementById("progress");
const backBtn=document.getElementById("backBtn");
const nextBtn=document.getElementById("nextBtn");
const nameDisplay=document.getElementById("nameDisplay");

let step=0;

const state={
  gender:"",
  skin:"#dda06f",
  hairStyle:"short",
  hair:"#5a3525",
  outfit:"shirt",
  clothes:"#3f78b5",
  name:""
};

const steps=[
  ["gender","Boy or Girl?","Choose your character."],
  ["skin","Choose Skin Tone","Pick the skin tone you like."],
  ["hairStyle","Choose Hairstyle","Choose a hairstyle."],
  ["hair","Choose Hair Colour","Choose a hair colour."],
  ["outfit","Choose Clothes","Choose an outfit."],
  ["clothes","Choose Clothes Colour","Choose the main colour."],
  ["name","What Is Your Name?","Enter your adventure name."]
];

const data={
  gender:[
    ["boy","Boy","👦"],
    ["girl","Girl","👧"]
  ],
  skin:[
    ["#f2c29b","Light"],
    ["#dda06f","Warm"],
    ["#bf7448","Tan"],
    ["#8c4f35","Brown"],
    ["#56372b","Deep"]
  ],
  hairStyle:[
    ["short","Short","✂"],
    ["spiky","Spiky","▲"],
    ["side","Side","◢"],
    ["bob","Bob","●"],
    ["long","Long","▮"],
    ["pony","Ponytail","➰"]
  ],
  hair:[
    ["#241b18","Black"],
    ["#5a3525","Dark Brown"],
    ["#8a4f2c","Chestnut"],
    ["#d0a84d","Golden"],
    ["#9e4b32","Auburn"],
    ["#bb3d28","Red"]
  ],
  outfit:[
    ["shirt","Shirt","👕"],
    ["hoodie","Hoodie","🧥"],
    ["overalls","Overalls","🧰"],
    ["tunic","Tunic","🗺"],
    ["dress","Dress","👗"],
    ["smart","Smart","🎀"]
  ],
  clothes:[
    ["#3f78b5","Blue"],
    ["#4f8a52","Green"],
    ["#b84b43","Red"],
    ["#d8b448","Yellow"],
    ["#c76d96","Pink"],
    ["#737b84","Grey"]
  ]
};

function rect(x,y,w,h,color){
  ctx.fillStyle=color;
  ctx.fillRect(x,y,w,h);
}

function drawCharacter(){
  ctx.clearRect(0,0,64,64);

  const skin=state.skin;
  const hair=state.hair;
  const clothes=state.clothes;
  const outline="#2b211b";

  rect(18,56,28,4,"rgba(0,0,0,.18)");

  rect(22,44,7,12,outline);
  rect(35,44,7,12,outline);
  rect(23,45,5,10,"#40536f");
  rect(36,45,5,10,"#40536f");

  rect(20,54,11,4,outline);
  rect(33,54,11,4,outline);
  rect(21,54,9,3,"#6e4529");
  rect(34,54,9,3,"#6e4529");

  if(["bob","long","pony"].includes(state.hairStyle)){
    rect(17,13,30,24,outline);
    rect(18,14,28,23,hair);
  }

  if(state.hairStyle==="long"){
    rect(16,28,7,19,outline);
    rect(41,28,7,19,outline);
    rect(17,28,5,18,hair);
    rect(42,28,5,18,hair);
  }

  if(state.hairStyle==="pony"){
    rect(46,18,8,18,outline);
    rect(47,19,6,16,hair);
  }

  rect(18,35,28,13,outline);
  rect(19,36,26,11,clothes);

  if(state.outfit==="dress"){
    rect(15,46,34,7,outline);
    rect(16,46,32,6,clothes);
  }

  rect(14,36,5,12,outline);
  rect(45,36,5,12,outline);
  rect(15,37,4,10,skin);
  rect(45,37,4,10,skin);

  if(state.outfit==="hoodie"){
    rect(24,36,16,3,"#f2e4c6");
    rect(28,39,2,7,"#f2e4c6");
    rect(35,39,2,7,"#f2e4c6");
  }

  if(state.outfit==="overalls"){
    rect(23,36,4,9,"#f2e4c6");
    rect(37,36,4,9,"#f2e4c6");
    rect(27,40,10,8,"#4f6f99");
  }

  if(state.outfit==="tunic"){
    rect(31,36,2,11,"#ead5a5");
    rect(19,43,26,2,"#7a4b2a");
  }

  if(state.outfit==="smart"){
    rect(26,36,12,9,"#f6eed9");
    rect(31,38,2,7,"#9f4038");
  }

  rect(27,31,10,6,outline);
  rect(28,31,8,6,skin);

  rect(17,19,5,10,outline);
  rect(42,19,5,10,outline);
  rect(18,20,4,8,skin);
  rect(42,20,4,8,skin);

  rect(20,13,24,20,outline);
  rect(21,14,22,18,skin);

  if(state.hairStyle==="short"){
    rect(20,10,24,8,outline);
    rect(21,11,22,7,hair);
  }
  if(state.hairStyle==="spiky"){
    rect(20,11,24,7,outline);
    rect(21,12,22,6,hair);
    rect(21,7,4,5,hair);
    rect(27,5,4,7,hair);
    rect(33,7,4,5,hair);
    rect(39,8,4,4,hair);
  }
  if(state.hairStyle==="side"){
    rect(20,10,24,8,outline);
    rect(21,11,22,7,hair);
    rect(21,16,11,4,hair);
  }
  if(state.hairStyle==="bob"){
    rect(20,10,24,9,outline);
    rect(21,11,22,8,hair);
    rect(18,16,5,16,hair);
    rect(41,16,5,16,hair);
  }
  if(state.hairStyle==="long"||state.hairStyle==="pony"){
    rect(20,10,24,9,outline);
    rect(21,11,22,8,hair);
  }

  rect(25,22,4,4,outline);
  rect(35,22,4,4,outline);
  rect(26,22,1,1,"white");
  rect(36,22,1,1,"white");

  rect(23,28,4,2,"#d78379");
  rect(38,28,4,2,"#d78379");
  rect(29,28,7,2,outline);

  if(state.gender==="girl"){
    rect(42,13,4,4,outline);
    rect(43,14,2,2,"#e7bb4e");
  }
}

function save(){
  localStorage.setItem("bibleKidsCharacter",JSON.stringify(state));
  localStorage.setItem("bibleKidsPlayerName",state.name.trim());
}

function selectValue(key,value){
  state[key]=value;
  save();
  drawCharacter();
  renderStep();
}

function renderStep(){
  const [key,titleText,helpText]=steps[step];
  question.textContent=titleText;
  help.textContent=helpText;
  choices.innerHTML="";
  choices.className="choices";

  if(key==="name"){
    choices.className="";
    const wrap=document.createElement("div");
    wrap.className="namebox";

    const label=document.createElement("label");
    label.textContent="Enter your name";

    const input=document.createElement("input");
    input.placeholder="Type your name";
    input.maxLength=18;
    input.value=state.name;

    input.addEventListener("input",()=>{
      state.name=input.value.replace(/[<>]/g,"").slice(0,18);
      input.value=state.name;
      nameDisplay.textContent=state.name.trim()||"Young Explorer";
      save();
      updateButtons();
    });

    wrap.append(label,input);
    choices.appendChild(wrap);
    setTimeout(()=>input.focus(),50);
  }else{
    data[key].forEach(item=>{
      const [value,label,icon]=item;
      const button=document.createElement("button");
      button.type="button";
      button.className="choice"+(state[key]===value?" selected":"");

      if(["skin","hair","clothes"].includes(key)){
        const swatch=document.createElement("div");
        swatch.className="swatch";
        swatch.style.background=value;
        button.appendChild(swatch);
      }else{
        const iconBox=document.createElement("div");
        iconBox.className="icon";
        iconBox.textContent=icon||"★";
        button.appendChild(iconBox);
      }

      const text=document.createElement("div");
      text.textContent=label;
      button.appendChild(text);

      button.addEventListener("click",()=>selectValue(key,value));
      choices.appendChild(button);
    });
  }

  progress.textContent=`Step ${step+1} / 7`;
  updateButtons();
}

function updateButtons(){
  backBtn.textContent=step===0?"← Home":"← Back";
  nextBtn.textContent=step===6?"Begin Adventure →":"Next →";
  nextBtn.disabled=(step===0&&!state.gender)||(step===6&&!state.name.trim());
}

backBtn.addEventListener("click",()=>{
  if(step===0){
    location.href="index.html";
  }else{
    step--;
    renderStep();
  }
});

nextBtn.addEventListener("click",()=>{
  if(nextBtn.disabled)return;

  if(step<6){
    step++;
    renderStep();
  }else{
    save();
    location.href="map.html";
  }
});

try{
  const saved=JSON.parse(localStorage.getItem("bibleKidsCharacter"));
  if(saved&&typeof saved==="object"){
    Object.assign(state,saved);
  }
}catch(error){}

nameDisplay.textContent=state.name.trim()||"Young Explorer";
drawCharacter();
renderStep();
</script>
</body>
</html>
