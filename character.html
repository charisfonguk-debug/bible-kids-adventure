<!DOCTYPE html>
<html lang="zh-HK">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
  <title>Create Your Character | Bible Kids Adventure</title>

  <style>
    * { box-sizing: border-box; }

    html, body {
      width: 100%;
      min-height: 100%;
      margin: 0;
    }

    body {
      min-height: 100vh;
      overflow-x: hidden;
      font-family: "Trebuchet MS", Arial, "Noto Sans TC", "Microsoft JhengHei", sans-serif;
      background: #789766;
    }

    button, input { font: inherit; }
    button { cursor: pointer; }

    .page {
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: max(14px, env(safe-area-inset-top))
               max(14px, env(safe-area-inset-right))
               max(14px, env(safe-area-inset-bottom))
               max(14px, env(safe-area-inset-left));
      background:
        linear-gradient(rgba(32,57,34,.28), rgba(52,67,37,.30)),
        url("images/home-background.png") center / cover no-repeat,
        #789766;
    }

    .creator-shell {
      width: min(97vw, 1400px);
      min-height: min(94vh, 900px);
      display: grid;
      grid-template-rows: auto 1fr auto;
      overflow: hidden;
      border: 8px solid #4c2b15;
      border-radius: 25px 17px 28px 19px;
      background: linear-gradient(#9b6030, #653919);
      box-shadow: 0 12px 0 #321c0e, 0 28px 55px rgba(25,17,10,.43);
    }

    .top-wood {
      display: grid;
      grid-template-columns: 150px 1fr 150px;
      align-items: center;
      min-height: 86px;
      padding: 14px clamp(18px,3vw,34px);
      border-bottom: 7px solid #482712;
      background:
        repeating-linear-gradient(3deg, rgba(255,232,182,.05) 0 2px, transparent 3px 16px),
        linear-gradient(#b4743b, #7e4b23);
    }

    .brand {
      justify-self: start;
      padding: 9px 14px 10px;
      border: 3px solid #472713;
      border-radius: 14px 10px 16px 11px;
      background: linear-gradient(#9c602e, #693919);
      box-shadow: 0 4px 0 #3a200f;
      text-align: center;
      transform: rotate(-1deg);
    }

    .brand-small {
      display: block;
      color: #fff0c7;
      font-size: 10px;
      font-weight: 900;
      letter-spacing: 2px;
    }

    .brand-large {
      display: block;
      margin-top: 4px;
      color: #ffd66b;
      font-size: 20px;
      font-weight: 900;
      text-shadow: 1px 2px 0 #47240f;
    }

    .top-title {
      margin: 0;
      color: #fff0c9;
      font-size: clamp(27px,4vw,44px);
      font-weight: 900;
      text-align: center;
      text-shadow: 2px 3px 0 #472612;
    }

    .main-area {
      display: grid;
      grid-template-columns: minmax(330px,.86fr) minmax(500px,1.34fr);
      min-height: 0;
    }

    .preview-side {
      position: relative;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      min-width: 0;
      padding: clamp(22px,3vw,40px);
      overflow: hidden;
      border-right: 7px solid #503019;
      background:
        linear-gradient(rgba(235,244,218,.12), rgba(55,84,46,.28)),
        url("images/home-background.png") center / cover no-repeat,
        #7c9a68;
    }

    .preview-side::before {
      content: "";
      position: absolute;
      inset: 0;
      background: radial-gradient(circle at 50% 42%, rgba(255,252,220,.55), rgba(123,154,96,.17) 52%, rgba(43,70,40,.31));
      pointer-events: none;
    }

    .preview-title,
    .character-name {
      position: relative;
      z-index: 3;
      padding: 8px 19px;
      border: 3px solid #523319;
      border-radius: 999px;
      background: rgba(255,243,203,.96);
      box-shadow: 0 5px 0 #462914;
      color: #53351e;
      font-weight: 900;
      text-align: center;
    }

    .preview-title {
      margin: 0 0 16px;
      font-size: clamp(15px,2vw,19px);
    }

    .character-name {
      min-height: 39px;
      margin: 19px 0 0;
      font-size: clamp(21px,3vw,29px);
      line-height: 1;
    }

    .avatar-stage {
      position: relative;
      z-index: 2;
      width: min(100%, 430px);
      min-height: 475px;
      display: flex;
      align-items: flex-end;
      justify-content: center;
      overflow: hidden;
      border: 5px solid rgba(76,46,22,.84);
      border-radius: 32px 22px 35px 24px;
      background: radial-gradient(circle at 50% 33%, rgba(255,255,237,.98), rgba(196,223,161,.86) 55%, rgba(89,139,74,.9));
      box-shadow: 0 9px 0 rgba(66,38,17,.88), 0 18px 34px rgba(36,25,14,.28);
    }

    .avatar-stage::before {
      content: "";
      position: absolute;
      left: -10%;
      right: -10%;
      bottom: -65px;
      height: 150px;
      border-radius: 50%;
      background: linear-gradient(rgba(76,121,62,.73), rgba(55,95,47,.91));
    }

    .avatar-glow {
      position: absolute;
      top: 28px;
      left: 50%;
      width: 310px;
      height: 310px;
      transform: translateX(-50%);
      border-radius: 50%;
      background: radial-gradient(circle, rgba(255,249,194,.60), transparent 68%);
    }

    #avatarSvg {
      position: relative;
      z-index: 3;
      display: block;
      width: min(94%, 395px);
      height: auto;
      margin-bottom: -2px;
      filter: drop-shadow(0 12px 8px rgba(51,38,23,.23));
      transition: transform .25s ease, width .25s ease, margin .25s ease;
    }

    .avatar-stage.focus-head {
      align-items: flex-start;
    }

    .avatar-stage.focus-head #avatarSvg {
      width: 145%;
      max-width: none;
      margin-top: -55px;
      margin-bottom: -205px;
      transform: scale(1.05);
      transform-origin: center top;
    }

    .focus-label {
      position: absolute;
      top: 14px;
      right: 14px;
      z-index: 6;
      display: none;
      padding: 6px 11px;
      border: 2px solid #57351a;
      border-radius: 999px;
      background: rgba(255,245,207,.95);
      color: #58381f;
      font-size: 12px;
      font-weight: 900;
      box-shadow: 0 3px 0 #4b2d16;
    }

    .avatar-stage.focus-head .focus-label { display: block; }

    .question-side {
      display: flex;
      align-items: center;
      justify-content: center;
      min-width: 0;
      padding: clamp(24px,4vw,45px);
      background: linear-gradient(140deg, rgba(124,76,36,.83), rgba(90,49,23,.93));
    }

    .parchment {
      position: relative;
      width: min(100%,760px);
      min-height: 510px;
      display: flex;
      flex-direction: column;
      padding: clamp(35px,5vw,54px) clamp(24px,5vw,54px) 34px;
      overflow: hidden;
      border: 3px solid rgba(90,55,25,.7);
      border-radius: 12px 7px 15px 9px;
      background: linear-gradient(145deg,#fff4cf,#f5dfaa 50%,#ecd095);
      box-shadow: 0 9px 0 rgba(59,35,16,.68), 0 20px 38px rgba(33,22,13,.33);
    }

    .parchment::before {
      content: "";
      position: absolute;
      inset: 0;
      opacity: .21;
      background: repeating-linear-gradient(3deg,rgba(116,72,33,.09) 0 1px,transparent 2px 11px);
      pointer-events: none;
    }

    .nail {
      position: absolute;
      z-index: 5;
      width: 21px;
      height: 21px;
      border: 3px solid #474137;
      border-radius: 50%;
      background: radial-gradient(circle at 35% 30%,#e5e6e0,#8e968f 55%,#4c504b);
      box-shadow: 0 3px 4px rgba(42,30,18,.45);
    }

    .nail.tl { top: 17px; left: 18px; }
    .nail.tr { top: 17px; right: 18px; }
    .nail.bl { bottom: 17px; left: 18px; }
    .nail.br { bottom: 17px; right: 18px; }

    .question-heading {
      position: relative;
      z-index: 3;
      margin: 0;
      color: #a34116;
      font-size: clamp(29px,4.5vw,47px);
      font-weight: 900;
      line-height: 1.1;
      text-align: center;
      text-shadow: 1px 2px 0 rgba(255,238,181,.86);
    }

    .heading-line {
      position: relative;
      z-index: 3;
      width: min(90%,510px);
      height: 4px;
      margin: 17px auto 20px;
      border-radius: 999px;
      background: linear-gradient(90deg,transparent,#936331 20%,#936331 80%,transparent);
    }

    .question-help {
      position: relative;
      z-index: 3;
      max-width: 590px;
      margin: 0 auto 23px;
      color: #685036;
      font-size: clamp(14px,2vw,17px);
      font-weight: 800;
      line-height: 1.45;
      text-align: center;
    }

    .choices {
      position: relative;
      z-index: 3;
      display: grid;
      grid-template-columns: repeat(2,minmax(0,1fr));
      gap: 17px;
      width: 100%;
      max-width: 650px;
      margin: auto;
    }

    .choices.compact {
      grid-template-columns: repeat(3,minmax(0,1fr));
      gap: 14px;
    }

    .choice-card {
      position: relative;
      min-width: 0;
      min-height: 156px;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      padding: 13px 11px 14px;
      border: 4px solid #68401f;
      border-radius: 17px 12px 19px 13px;
      background: linear-gradient(145deg,rgba(255,252,231,.99),rgba(230,197,126,.97));
      box-shadow: 0 6px 0 #513018, 0 12px 20px rgba(52,36,20,.2);
      color: #49311d;
      font-weight: 900;
      transition: transform .18s ease, box-shadow .18s ease;
    }

    .choice-card:hover { transform: translateY(-5px); box-shadow: 0 11px 0 #513018; }
    .choice-card.selected {
      border-color: #406124;
      outline: 5px solid rgba(119,165,70,.63);
      outline-offset: 3px;
      background: linear-gradient(145deg,#fffdeb,#ddea9a);
      box-shadow: 0 7px 0 #3e5b28;
    }

    .choice-card.selected::after,
    .colour-choice.selected::after {
      content: "✓";
      position: absolute;
      display: flex;
      align-items: center;
      justify-content: center;
      border-radius: 50%;
      background: #538033;
      color: white;
      font-weight: 900;
    }

    .choice-card.selected::after {
      top: -13px;
      right: -11px;
      width: 37px;
      height: 37px;
      border: 3px solid #fff8d8;
      font-size: 22px;
    }

    .choice-preview {
      width: 118px;
      height: 118px;
      display: flex;
      align-items: center;
      justify-content: center;
      margin-bottom: 8px;
      overflow: hidden;
      border: 3px solid rgba(92,57,28,.45);
      border-radius: 16px;
      background: radial-gradient(circle,#ffffea,#b9dc97);
    }

    .choice-preview svg {
      width: 135px;
      height: 135px;
      flex: 0 0 auto;
    }

    .choice-label {
      font-size: clamp(15px,2vw,18px);
      font-weight: 900;
      text-align: center;
    }

    .colour-choices {
      grid-template-columns: repeat(3,minmax(0,1fr));
      max-width: 520px;
    }

    .colour-choice {
      position: relative;
      min-height: 101px;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      gap: 10px;
      padding: 12px 8px;
      border: 4px solid #67411f;
      border-radius: 16px 11px 18px 12px;
      background: rgba(255,248,220,.94);
      box-shadow: 0 6px 0 #513018;
      color: #4b321e;
      font-weight: 900;
    }

    .colour-choice.selected {
      border-color: #406124;
      outline: 5px solid rgba(119,165,70,.63);
      outline-offset: 3px;
      background: #ffffe6;
    }

    .colour-choice.selected::after {
      top: 7px;
      right: 8px;
      width: 27px;
      height: 27px;
      font-size: 18px;
    }

    .colour-circle {
      width: 55px;
      height: 55px;
      border: 5px solid #fff9e1;
      border-radius: 50%;
      box-shadow: 0 0 0 3px #5c3a20, 0 5px 0 rgba(72,43,20,.5);
    }

    .colour-label { font-size: 14px; }

    .name-step {
      position: relative;
      z-index: 3;
      width: min(100%,520px);
      margin: auto;
    }

    .name-label {
      display: block;
      margin-bottom: 13px;
      color: #593b24;
      font-size: 18px;
      font-weight: 900;
      text-align: center;
    }

    .name-input {
      width: 100%;
      min-height: 67px;
      padding: 14px 19px;
      border: 4px solid #66411f;
      border-radius: 17px 12px 19px 13px;
      outline: none;
      background: rgba(255,254,235,.99);
      box-shadow: inset 0 4px 6px rgba(93,57,26,.13), 0 6px 0 #513018;
      color: #442d1c;
      font-size: 23px;
      font-weight: 900;
      text-align: center;
    }

    .name-input:focus {
      border-color: #4e7130;
      box-shadow: inset 0 4px 6px rgba(93,57,26,.13), 0 6px 0 #3a5625, 0 0 0 5px rgba(113,155,67,.3);
    }

    .name-note {
      margin: 17px 0 0;
      color: #6c5337;
      font-size: 14px;
      font-weight: 800;
      line-height: 1.45;
      text-align: center;
    }

    .navigation-bar {
      display: grid;
      grid-template-columns: minmax(130px,1fr) auto minmax(130px,1fr);
      align-items: center;
      min-height: 86px;
      padding: 14px clamp(16px,3vw,35px);
      border-top: 7px solid #482611;
      background:
        repeating-linear-gradient(2deg,rgba(255,230,176,.05) 0 2px,transparent 3px 15px),
        linear-gradient(#9c5e2e,#703f1d);
    }

    .nav-button {
      min-width: 145px;
      min-height: 52px;
      padding: 11px 19px;
      border: 4px solid #472914;
      border-radius: 15px 10px 17px 11px;
      background: linear-gradient(#f2c76c,#ae6c2d);
      box-shadow: 0 6px 0 #3b2110;
      color: #fff4d5;
      font-size: clamp(15px,2vw,19px);
      font-weight: 900;
      text-shadow: 1px 2px 0 rgba(66,34,14,.75);
    }

    .previous-button { justify-self: start; }
    .next-button { justify-self: end; }
    .nav-button:disabled { opacity: .44; cursor: not-allowed; }

    .progress-area {
      min-width: 180px;
      text-align: center;
    }

    .progress-text {
      display: block;
      color: #fff1cd;
      font-size: clamp(16px,2.2vw,21px);
      font-weight: 900;
      text-shadow: 1px 2px 0 #472611;
    }

    .progress-dots {
      display: flex;
      justify-content: center;
      gap: 6px;
      margin-top: 8px;
    }

    .progress-dot {
      width: 10px;
      height: 10px;
      border: 2px solid rgba(255,244,207,.88);
      border-radius: 50%;
      background: rgba(75,39,18,.62);
    }

    .progress-dot.complete { background: #d5ee86; }
    .progress-dot.current {
      transform: scale(1.35);
      background: #fff6b3;
      box-shadow: 0 0 8px rgba(255,246,179,.82);
    }

    body::after {
      content: "";
      position: fixed;
      inset: 0;
      z-index: 100;
      pointer-events: none;
      opacity: 0;
      background: radial-gradient(circle,rgba(255,255,234,.99),rgba(247,224,158,1));
      transition: opacity .85s ease;
    }

    body.leaving::after { opacity: 1; }

    @media (max-width: 760px) {
      .page { display: block; padding: 9px 8px 13px; }
      .creator-shell { width: 100%; min-height: auto; border-width: 5px; }
      .top-wood { grid-template-columns: 1fr; min-height: 73px; justify-items: center; border-bottom-width: 5px; }
      .brand { display: none; }
      .main-area { display: flex; flex-direction: column; }
      .preview-side { padding: 17px 13px 22px; border-right: 0; border-bottom: 5px solid #503019; }
      .avatar-stage { width: min(88vw,335px); min-height: 330px; }
      #avatarSvg { width: min(92%,310px); }
      .avatar-stage.focus-head #avatarSvg { width: 150%; margin-top: -50px; margin-bottom: -160px; }
      .question-side { padding: 18px 10px 21px; }
      .parchment { width: 100%; min-height: 435px; padding: 39px 15px 29px; }
      .choices, .choices.compact, .colour-choices { grid-template-columns: repeat(2,minmax(0,1fr)); gap: 13px; }
      .choice-card { min-height: 138px; padding: 9px 6px 11px; }
      .choice-preview { width: 88px; height: 88px; }
      .choice-preview svg { width: 112px; height: 112px; }
      .navigation-bar { min-height: 76px; padding: 11px 8px; border-top-width: 5px; }
      .nav-button { min-width: 0; min-height: 48px; padding: 9px; border-width: 3px; font-size: 13px; }
      .progress-area { min-width: 112px; }
      .progress-text { font-size: 14px; }
    }

    @media (max-width: 390px) {
      .choices, .choices.compact { grid-template-columns: 1fr; }
      .colour-choices { grid-template-columns: repeat(2,minmax(0,1fr)); }
      .choice-card { flex-direction: row; min-height: 106px; gap: 13px; }
      .choice-preview { flex-shrink: 0; margin-bottom: 0; }
      .navigation-bar { grid-template-columns: 1fr 98px 1fr; }
    }

    @media (prefers-reduced-motion: reduce) {
      *, *::before, *::after { transition: none !important; animation: none !important; }
    }
  </style>
</head>

<body>
  <main class="page">
    <section class="creator-shell">
      <header class="top-wood">
        <div class="brand" aria-label="Bible Kids Adventure">
          <span class="brand-small">BIBLE KIDS</span>
          <span class="brand-large">ADVENTURE</span>
        </div>

        <h1 class="top-title" id="topTitle">Create Your Character!</h1>
        <div aria-hidden="true"></div>
      </header>

      <div class="main-area">
        <section class="preview-side">
          <p class="preview-title" id="previewTitle">Your Character</p>

          <div class="avatar-stage" id="avatarStage">
            <div class="avatar-glow"></div>
            <span class="focus-label" id="focusLabel">Close-up view</span>
            <svg id="avatarSvg" viewBox="0 0 360 500" role="img" aria-label="Character preview"></svg>
          </div>

          <p class="character-name" id="characterName">Young Explorer</p>
        </section>

        <section class="question-side">
          <div class="parchment">
            <span class="nail tl" aria-hidden="true"></span>
            <span class="nail tr" aria-hidden="true"></span>
            <span class="nail bl" aria-hidden="true"></span>
            <span class="nail br" aria-hidden="true"></span>

            <h2 class="question-heading" id="questionHeading">Boy or Girl?</h2>
            <div class="heading-line"></div>
            <p class="question-help" id="questionHelp">Choose the character you would like to create.</p>
            <div class="choices" id="choices"></div>
          </div>
        </section>
      </div>

      <nav class="navigation-bar" aria-label="Character creation steps">
        <button type="button" class="nav-button previous-button" id="previousButton">← Back</button>

        <div class="progress-area">
          <span class="progress-text" id="progressText">Step 1 / 7</span>
          <div class="progress-dots" id="progressDots" aria-hidden="true"></div>
        </div>

        <button type="button" class="nav-button next-button" id="nextButton" disabled>Next →</button>
      </nav>
    </section>
  </main>

    const choices = $("choices");

          darkBrown:"Dark Brown", brown:"Brown", lightBrown:"Light Brown", golden:"Golden", auburn:"Auburn", red:"Red",
          hoodie:"Hoodie", overalls:"Overalls", tshirt:"T-Shirt", sweater:"Sweater", tunic:"Adventure Tunic", smart:"Smart Shirt",
          blue:"Blue", green:"Green", redClothes:"Red", yellow:"Yellow", pink:"Pink", grey:"Grey",

      "zh-HK": {

        questions: [
          ["你係男仔定女仔？", "揀選你想建立嘅角色。"],

          ["揀選頭髮顏色", "揀選你角色嘅頭髮顏色。"],
          ["揀選衣服", "揀一套適合冒險嘅衣服。"],
          ["揀選衣服顏色", "揀選你最鍾意嘅衣服顏色。"],
          ["你叫咩名？", "你嘅名字會喺聖經冒險旅程中出現。"]
        ],
        labels: {
          boy:"男仔", girl:"女仔",
          skinLight:"淺膚色", skinWarm:"暖膚色", skinTan:"小麥色", skinBrown:"啡膚色", skinDeep:"深膚色",
          short:"短髮", curly:"曲髮", side:"側分髮", bob:"齊肩髮", long:"長髮", ponytail:"馬尾",
          darkBrown:"深啡色", brown:"啡色", lightBrown:"淺啡色", golden:"金色", auburn:"紅啡色", red:"紅色",
          hoodie:"連帽衫", overalls:"工人褲", tshirt:"短袖上衣", sweater:"冷衫", tunic:"探險衣", smart:"醒目恤衫",
          blue:"藍色", green:"綠色", redClothes:"紅色", yellow:"黃色", pink:"粉紅色", grey:"灰色",
          nameLabel:"輸入你嘅名字", namePlaceholder:"喺度輸入名字",
          nameNote:"請輸入 1 至 18 個中文字、英文字或數字。"
        }
      }
    };

    const genderOptions = [
      { value:"boy", labelKey:"boy", hairStyle:"short" },
      { value:"girl", labelKey:"girl", hairStyle:"long" }
    ];

    const skinOptions = [
      { value:"ffdbb4", labelKey:"skinLight" },
      { value:"edb98a", labelKey:"skinWarm" },
      { value:"d08b5b", labelKey:"skinTan" },
      { value:"ae5d29", labelKey:"skinBrown" },
      { value:"614335", labelKey:"skinDeep" }
    ];

    const hairStyleOptions = [
      { value:"short", labelKey:"short" },
      { value:"curly", labelKey:"curly" },
      { value:"side", labelKey:"side" },
      { value:"bob", labelKey:"bob" },
      { value:"long", labelKey:"long" },
      { value:"ponytail", labelKey:"ponytail" }
    ];

    const hairColourOptions = [
      { value:"2c1b18", labelKey:"darkBrown" },
      { value:"724133", labelKey:"brown" },
      { value:"a55728", labelKey:"lightBrown" },
      { value:"d6b370", labelKey:"golden" },
      { value:"b45f3b", labelKey:"auburn" },
      { value:"c93305", labelKey:"red" }
    ];

    const clothesStyleOptions = [
      { value:"hoodie", labelKey:"hoodie" },
      { value:"overalls", labelKey:"overalls" },
      { value:"tshirt", labelKey:"tshirt" },
      { value:"sweater", labelKey:"sweater" },
      { value:"tunic", labelKey:"tunic" },
      { value:"smart", labelKey:"smart" }
    ];

    const clothesColourOptions = [
      { value:"5199e4", labelKey:"blue" },
      { value:"65b87a", labelKey:"green" },
      { value:"ef5b5b", labelKey:"redClothes" },
      { value:"e8c85d", labelKey:"yellow" },
      { value:"ec75a5", labelKey:"pink" },
      { value:"929598", labelKey:"grey" }
    ];

    function getLanguage() {
      return localStorage.getItem("bibleKidsLanguage") === "zh-HK" ? "zh-HK" : "en";
    }

    function getText() {
      return text[getLanguage()];
    }

    function esc(value) {
      return String(value).replace(/[&<>"']/g, function(char) {
        return { "&":"&amp;", "<":"&lt;", ">":"&gt;", '"':"&quot;", "'":"&#039;" }[char];
      });
    }

    function createHair(style, color) {
      const c = "#" + color;

      const styles = {
        short: `
          <path d="M112 144 Q122 73 180 71 Q239 72 249 143
                   Q225 121 198 116 Q161 107 112 144Z"
                fill="${c}" stroke="#3a261f" stroke-width="6"/>
          <path d="M119 122 Q145 87 182 84 Q220 85 244 122"
                fill="none" stroke="${c}" stroke-width="26" stroke-linecap="round"/>`,

        curly: `
          <g fill="${c}" stroke="#3a261f" stroke-width="5">
            <circle cx="126" cy="116" r="27"/><circle cx="151" cy="91" r="28"/>
            <circle cx="183" cy="83" r="29"/><circle cx="216" cy="94" r="28"/>
            <circle cx="238" cy="121" r="27"/><circle cx="111" cy="143" r="23"/>
            <circle cx="248" cy="145" r="23"/>
          </g>`,

        side: `
          <path d="M105 148 Q111 77 178 68 Q236 65 257 135
                   Q223 111 183 117 Q139 122 105 148Z"
                fill="${c}" stroke="#3a261f" stroke-width="6"/>
          <path d="M176 73 Q146 99 117 130" fill="none"
                stroke="#3a261f" stroke-width="6" stroke-linecap="round"/>`,

        bob: `
          <path d="M101 151 Q101 69 180 66 Q259 69 259 153
                   L248 225 Q226 202 214 164
                   Q180 183 144 164 Q132 202 111 225Z"
                fill="${c}" stroke="#3a261f" stroke-width="6"/>`,

        long: `
          <path d="M96 151 Q99 63 180 62 Q262 65 265 153
                   L257 300 Q231 288 219 225
                   Q205 174 180 170 Q154 174 141 225
                   Q129 288 103 300Z"
                fill="${c}" stroke="#3a261f" stroke-width="6"/>`,

        ponytail: `
          <path d="M103 150 Q106 70 179 66 Q245 68 257 143
                   Q221 113 181 116 Q140 116 103 150Z"
                fill="${c}" stroke="#3a261f" stroke-width="6"/>
          <path d="M242 108 Q292 107 285 172 Q280 219 246 239
                   Q263 185 242 108Z"
                fill="${c}" stroke="#3a261f" stroke-width="6"/>`
      };

      return styles[style] || styles.short;
    }

    function createClothes(style, color) {
      const c = "#" + color;
      const dark = "#3d4a55";
      const light = "#fff1d4";

      const styles = {
        hoodie: `
          <path d="M107 282 Q180 249 253 282 L281 449 L79 449Z"
                fill="${c}" stroke="#493020" stroke-width="7"/>
          <path d="M137 278 Q180 317 223 278 Q218 247 180 244 Q142 247 137 278Z"
                fill="${c}" stroke="#493020" stroke-width="7"/>
          <path d="M159 294 L154 342 M201 294 L206 342"
                stroke="${light}" stroke-width="6" stroke-linecap="round"/>
          <rect x="144" y="357" width="72" height="45" rx="20"
                fill="none" stroke="#493020" stroke-width="6"/>`,

        overalls: `
          <path d="M107 282 Q180 249 253 282 L281 449 L79 449Z"
                fill="${light}" stroke="#493020" stroke-width="7"/>
          <path d="M125 302 L235 302 L244 449 L116 449Z"
                fill="${c}" stroke="#493020" stroke-width="7"/>
          <path d="M130 281 L151 354 M230 281 L209 354"
                stroke="${c}" stroke-width="18" stroke-linecap="round"/>
          <rect x="151" y="333" width="58" height="48" rx="8"
                fill="${c}" stroke="#493020" stroke-width="6"/>`,

        tshirt: `
          <path d="M108 284 L139 265 Q180 289 221 265 L252 284
                   L282 336 L247 356 L244 449 L116 449 L113 356
                   L78 336Z"
                fill="${c}" stroke="#493020" stroke-width="7"/>
          <path d="M150 270 Q180 299 210 270"
                fill="none" stroke="#493020" stroke-width="6"/>`,

        sweater: `
          <path d="M107 282 Q180 248 253 282 L281 449 L79 449Z"
                fill="${c}" stroke="#493020" stroke-width="7"/>
          <path d="M142 271 Q180 315 218 271"
                fill="${light}" stroke="#493020" stroke-width="6"/>
          <path d="M108 340 H252 M112 384 H248"
                stroke="rgba(255,255,255,.45)" stroke-width="8"/>`,

        tunic: `
          <path d="M112 277 Q180 251 248 277 L265 449 L95 449Z"
                fill="${c}" stroke="#493020" stroke-width="7"/>
          <path d="M179 274 V449" stroke="#493020" stroke-width="6"/>
          <path d="M139 292 Q180 319 221 292"
                fill="none" stroke="${light}" stroke-width="8"/>
          <path d="M104 360 H256" stroke="#8a5b2e" stroke-width="15"/>
          <circle cx="180" cy="360" r="14" fill="#e8c85d" stroke="#493020" stroke-width="5"/>`,

        smart: `
          <path d="M107 282 Q180 249 253 282 L281 449 L79 449Z"
                fill="${c}" stroke="#493020" stroke-width="7"/>
          <path d="M145 269 L180 319 L215 269 L225 449 L135 449Z"
                fill="${light}" stroke="#493020" stroke-width="6"/>
          <path d="M145 269 L180 319 L159 345 L124 289Z"
                fill="${c}" stroke="#493020" stroke-width="5"/>
          <path d="M215 269 L180 319 L201 345 L236 289Z"
                fill="${c}" stroke="#493020" stroke-width="5"/>
          <path d="M180 319 L167 355 L180 384 L193 355Z"
                fill="#b3433d" stroke="#493020" stroke-width="4"/>`
      };

      return styles[style] || styles.hoodie;
    }

    function avatarMarkup(custom = {}, small = false) {
      const s = { ...state, ...custom };
      const skin = "#" + s.skinColor;
      const eye = "#3b2a24";
      const outline = "#493020";

      return `
        <defs>
          <linearGradient id="legShade" x1="0" y1="0" x2="0" y2="1">
            <stop offset="0" stop-color="#4c6480"/>
            <stop offset="1" stop-color="#35485f"/>
          </linearGradient>
        </defs>

        <!-- back hair -->
        ${["bob","long","ponytail"].includes(s.hairStyle) ? createHair(s.hairStyle, s.hairColor) : ""}

        <!-- legs -->
        <path d="M120 423 L174 423 L170 487 L112 487Z"
              fill="url(#legShade)" stroke="${outline}" stroke-width="7"/>
        <path d="M186 423 L240 423 L248 487 L190 487Z"
              fill="url(#legShade)" stroke="${outline}" stroke-width="7"/>

        <!-- shoes -->
        <path d="M107 474 Q143 462 174 477 L174 495 L104 495Z"
              fill="#5f4029" stroke="${outline}" stroke-width="6"/>
        <path d="M186 477 Q218 462 253 474 L256 495 L186 495Z"
              fill="#5f4029" stroke="${outline}" stroke-width="6"/>

        <!-- ears -->
        <ellipse cx="106" cy="171" rx="22" ry="30" fill="${skin}" stroke="${outline}" stroke-width="6"/>
        <ellipse cx="254" cy="171" rx="22" ry="30" fill="${skin}" stroke="${outline}" stroke-width="6"/>

        <!-- neck -->
        <path d="M151 231 L209 231 L216 282 Q180 304 144 282Z"
              fill="${skin}" stroke="${outline}" stroke-width="7"/>

        <!-- body clothes -->
        ${createClothes(s.clothesStyle, s.clothesColor)}

        <!-- arms -->
        <path d="M104 296 Q72 329 73 410 Q75 432 95 425 L122 342Z"
              fill="${skin}" stroke="${outline}" stroke-width="7"/>
        <path d="M256 296 Q288 329 287 410 Q285 432 265 425 L238 342Z"
              fill="${skin}" stroke="${outline}" stroke-width="7"/>

        <!-- face -->
        <ellipse cx="180" cy="165" rx="76" ry="91"
                 fill="${skin}" stroke="${outline}" stroke-width="7"/>

        <!-- front hair -->
        ${!["bob","long","ponytail"].includes(s.hairStyle) ? createHair(s.hairStyle, s.hairColor) : `
          <path d="M108 144 Q119 83 180 76 Q240 83 252 143
                   Q222 120 190 118 Q154 116 108 144Z"
                fill="#${s.hairColor}" stroke="${outline}" stroke-width="6"/>
        `}

        <!-- eyebrows -->
        <path d="M135 151 Q151 140 165 151" fill="none" stroke="${eye}" stroke-width="7" stroke-linecap="round"/>
        <path d="M195 151 Q209 140 225 151" fill="none" stroke="${eye}" stroke-width="7" stroke-linecap="round"/>

        <!-- eyes -->
        <ellipse cx="151" cy="172" rx="10" ry="13" fill="${eye}"/>
        <ellipse cx="209" cy="172" rx="10" ry="13" fill="${eye}"/>
        <circle cx="154" cy="168" r="3" fill="white"/>
        <circle cx="212" cy="168" r="3" fill="white"/>

        <!-- nose -->
        <path d="M180 177 Q171 199 183 201" fill="none" stroke="#a66d50" stroke-width="5" stroke-linecap="round"/>

        <!-- smile -->
        <path d="M151 216 Q180 239 209 216"
              fill="#fff8e9" stroke="${outline}" stroke-width="6" stroke-linejoin="round"/>

        <!-- cheeks -->
        <ellipse cx="133" cy="205" rx="13" ry="7" fill="#ef8f86" opacity=".45"/>
        <ellipse cx="227" cy="205" rx="13" ry="7" fill="#ef8f86" opacity=".45"/>

        <!-- optional details -->
        ${s.gender === "girl" ? `
          <circle cx="105" cy="187" r="6" fill="#f2cf60" stroke="${outline}" stroke-width="3"/>
          <circle cx="255" cy="187" r="6" fill="#f2cf60" stroke="${outline}" stroke-width="3"/>
        ` : ""}

        <!-- backpack straps -->
        <path d="M120 302 Q104 335 111 384 M240 302 Q256 335 249 384"
              fill="none" stroke="#70482d" stroke-width="8" opacity=".75"/>
      `;
    }

    function updateAvatar() {
      avatarSvg.innerHTML = avatarMarkup();
      characterName.textContent = state.name.trim() || getText().defaultName;
    }

    function makeSvgPreview(custom) {
      const svg = document.createElementNS("http://www.w3.org/2000/svg", "svg");
      svg.setAttribute("viewBox", "70 55 220 315");
      svg.innerHTML = avatarMarkup(custom, true);
      return svg;
    }

    function createImageChoice(value, label, custom, selected) {
      const button = document.createElement("button");
      button.type = "button";
      button.className = "choice-card" + (selected ? " selected" : "");
      button.dataset.value = value;
      button.setAttribute("aria-pressed", selected ? "true" : "false");

      const preview = document.createElement("span");
      preview.className = "choice-preview";
      preview.appendChild(makeSvgPreview(custom));

      const labelElement = document.createElement("span");
      labelElement.className = "choice-label";
      labelElement.textContent = label;

      button.append(preview, labelElement);
      return button;
    }

    function createColourChoice(value, label, selected) {
      const button = document.createElement("button");
      button.type = "button";
      button.className = "colour-choice" + (selected ? " selected" : "");
      button.dataset.value = value;

      const circle = document.createElement("span");
      circle.className = "colour-circle";
      circle.style.backgroundColor = "#" + value;

      const labelElement = document.createElement("span");
      labelElement.className = "colour-label";
      labelElement.textContent = label;

      button.append(circle, labelElement);
      return button;
    }

    function saveCharacter() {
      localStorage.setItem("bibleKidsCharacter", JSON.stringify(state));
      localStorage.setItem("bibleKidsGender", state.gender);
      localStorage.setItem("bibleKidsSkinColor", state.skinColor);
      localStorage.setItem("bibleKidsHairStyle", state.hairStyle);
      localStorage.setItem("bibleKidsHairColour", state.hairColor);
      localStorage.setItem("bibleKidsOutfit", state.clothesStyle);
      localStorage.setItem("bibleKidsClothesColour", state.clothesColor);
      localStorage.setItem("bibleKidsPlayerName", state.name.trim());
    }

    function selectAndRefresh(key, value) {
      state[key] = value;
      saveCharacter();
      updateAvatar();
      renderStep();
    }

    function renderGenderStep() {
      choices.className = "choices";

      genderOptions.forEach(option => {
        const button = createImageChoice(
          option.value,
          getText().labels[option.labelKey],
          { gender:option.value, hairStyle:option.hairStyle },
          state.gender === option.value
        );

        button.addEventListener("click", () => {
          state.gender = option.value;
          state.hairStyle = option.hairStyle;
          saveCharacter();
          updateAvatar();
          renderStep();
        });

        choices.appendChild(button);
      });
    }

    function renderSkinStep() {
      choices.className = "choices colour-choices";

      skinOptions.forEach(option => {
        const button = createColourChoice(
          option.value,
          getText().labels[option.labelKey],
          state.skinColor === option.value
        );

        button.addEventListener("click", () => selectAndRefresh("skinColor", option.value));
        choices.appendChild(button);
      });
    }

    function renderHairStyleStep() {
      choices.className = "choices compact";

      hairStyleOptions.forEach(option => {
        const button = createImageChoice(
          option.value,
          getText().labels[option.labelKey],
          { hairStyle:option.value },
          state.hairStyle === option.value
        );

        button.addEventListener("click", () => selectAndRefresh("hairStyle", option.value));
        choices.appendChild(button);
      });
    }

    function renderHairColourStep() {
      choices.className = "choices colour-choices";

      hairColourOptions.forEach(option => {
        const button = createColourChoice(
          option.value,
          getText().labels[option.labelKey],
          state.hairColor === option.value
        );

        button.addEventListener("click", () => selectAndRefresh("hairColor", option.value));
        choices.appendChild(button);
      });
    }

    function renderClothesStep() {
      choices.className = "choices compact";

      clothesStyleOptions.forEach(option => {
        const button = createImageChoice(
          option.value,
          getText().labels[option.labelKey],
          { clothesStyle:option.value },
          state.clothesStyle === option.value
        );

        button.addEventListener("click", () => selectAndRefresh("clothesStyle", option.value));
        choices.appendChild(button);
      });
    }

    function renderClothesColourStep() {
      choices.className = "choices colour-choices";

      clothesColourOptions.forEach(option => {
        const button = createColourChoice(
          option.value,
          getText().labels[option.labelKey],
          state.clothesColor === option.value
        );

        button.addEventListener("click", () => selectAndRefresh("clothesColor", option.value));
        choices.appendChild(button);
      });
    }

    function renderNameStep() {
      choices.className = "";

      const wrapper = document.createElement("div");
      wrapper.className = "name-step";

      const label = document.createElement("label");
      label.className = "name-label";
      label.htmlFor = "playerName";
      label.textContent = getText().labels.nameLabel;

      const input = document.createElement("input");
      input.type = "text";
      input.id = "playerName";
      input.className = "name-input";
      input.maxLength = 18;
      input.autocomplete = "off";
      input.placeholder = getText().labels.namePlaceholder;
      input.value = state.name;

      const note = document.createElement("p");
      note.className = "name-note";
      note.textContent = getText().labels.nameNote;

      input.addEventListener("input", () => {
        state.name = input.value.replace(/[<>]/g, "").slice(0,18);
        input.value = state.name;
        saveCharacter();
        updateAvatar();
        updateNavigation();
      });

      input.addEventListener("keydown", event => {
        if (event.key === "Enter" && isCurrentStepComplete()) finishCharacter();
      });

      wrapper.append(label, input, note);
      choices.appendChild(wrapper);

      setTimeout(() => input.focus(), 60);
    }

    function renderStep() {
      avatarStage.classList.toggle("focus-head", [1,2,3].includes(currentStep));

      const question = getText().questions[currentStep];
      questionHeading.textContent = question[0];
      questionHelp.textContent = question[1];
      choices.innerHTML = "";

      if (currentStep === 0) renderGenderStep();
      if (currentStep === 1) renderSkinStep();
      if (currentStep === 2) renderHairStyleStep();
      if (currentStep === 3) renderHairColourStep();
      if (currentStep === 4) renderClothesStep();
      if (currentStep === 5) renderClothesColourStep();
      if (currentStep === 6) renderNameStep();

      updateNavigation();
      updateProgress();
    }

    function isCurrentStepComplete() {
      if (currentStep === 0) return state.gender !== "";
      if (currentStep === 6) return state.name.trim().length > 0;
      return true;
    }

    function updateNavigation() {
      previousButton.textContent = getText().previous;
      nextButton.textContent = currentStep === totalSteps - 1 ? getText().finish : getText().next;
      nextButton.disabled = !isCurrentStepComplete();
    }

    function updateProgress() {
      progressText.textContent = getLanguage() === "zh-HK"
        ? `第 ${currentStep + 1}／${totalSteps} 步`
        : `Step ${currentStep + 1} / ${totalSteps}`;

      progressDots.innerHTML = "";

      for (let index = 0; index < totalSteps; index += 1) {
        const dot = document.createElement("span");
        dot.className = "progress-dot";
        if (index < currentStep) dot.classList.add("complete");
        if (index === currentStep) dot.classList.add("current");
        progressDots.appendChild(dot);
      }
    }

    previousButton.addEventListener("click", () => {
      if (currentStep === 0) {
        window.location.href = "index.html";
        return;
      }

      currentStep -= 1;
      renderStep();
    });

    nextButton.addEventListener("click", () => {
      if (!isCurrentStepComplete()) return;

      if (currentStep < totalSteps - 1) {
        currentStep += 1;
        renderStep();
        return;
      }

      finishCharacter();
    });

    function finishCharacter() {
      if (!state.gender || !state.name.trim()) return;

      saveCharacter();
      nextButton.disabled = true;
      document.body.classList.add("leaving");

      setTimeout(() => {
        window.location.href = "map.html";
      }, 850);
    }

    function loadCharacter() {
      const saved = localStorage.getItem("bibleKidsCharacter");
      if (!saved) return;

      try {
        const savedState = JSON.parse(saved);

        if (savedState && typeof savedState === "object") {
          if (savedState.topVariant && !savedState.hairStyle) {
            savedState.hairStyle = savedState.topVariant;
          }

          if (savedState.clothesVariant && !savedState.clothesStyle) {
            savedState.clothesStyle = savedState.clothesVariant;
          }

          Object.assign(state, savedState);
        }
      } catch (error) {
        console.warn("Could not load saved character.", error);
      }
    }

    function applyLanguage() {
      const language = getLanguage();
      const languageText = text[language];

      document.documentElement.lang = language;
      $("topTitle").textContent = languageText.topTitle;
      $("previewTitle").textContent = languageText.previewTitle;
      $("focusLabel").textContent = languageText.focusLabel;
    }

    window.addEventListener("load", () => {
      loadCharacter();
      applyLanguage();
      updateAvatar();
      renderStep();
    });
  </script>
</body>
